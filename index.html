<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS 26 Ultimate Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --ios-bg: #F2F2F7;
            --ios-blue: #007AFF;
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        
        body { background: #000; margin: 0; overflow: hidden; height: 100dvh; color: white; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }

        #os-container {
            position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto;
            background: #000; overflow: hidden;
        }

        /* Wallpaper */
        #wallpaper {
            position: absolute; inset: -20px;
            background: url('https://images.unsplash.com/photo-1620206343767-7da98185edd4?q=80&w=1920') center/cover;
            z-index: 1; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.8s;
        }
        .app-open #wallpaper { transform: scale(1.15); filter: blur(30px) brightness(0.6); }

        /* Island */
        #island {
            position: absolute; top: calc(11px + var(--safe-top)); left: 50%; transform: translateX(-50%);
            background: #000; z-index: 10000; width: 125px; height: 37px; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; transition: all 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #island.notif { width: 350px; height: 80px; border-radius: 35px; }

        /* Windows */
        .window {
            position: absolute; inset: 0; z-index: 5000; background: var(--ios-bg);
            transform: translateY(100%); border-radius: 45px;
            transition: transform 0.6s cubic-bezier(0.3, 1, 0.3, 1), border-radius 0.4s;
            overflow: hidden; color: black;
        }
        .window.active { transform: translateY(0); border-radius: 0; }

        /* iOS List Styles */
        .ios-list { background: white; border-radius: 12px; margin: 0 16px 20px; overflow: hidden; }
        .ios-item { 
            padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 0.5px solid #E5E5EA; cursor: pointer;
        }
        .ios-item:last-child { border-bottom: none; }
        .ios-item:active { background: #E5E5EA; }

        /* Home Indicator */
        #home-bar {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            width: 135px; height: 5px; background: rgba(255,255,255,0.8);
            border-radius: 10px; z-index: 10001; cursor: pointer;
        }
        
        /* Update Spinner */
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid var(--ios-blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="os-container">
    <div id="wallpaper"></div>

    <div id="island">
        <div id="island-content" class="opacity-0 transition-opacity duration-300 w-full px-4"></div>
    </div>

    <div id="home-screen" class="relative z-10 pt-20 px-6 h-full">
        <div class="grid grid-cols-4 gap-6" id="app-grid">
            <div class="flex flex-col items-center gap-2" onclick="GOS.openApp('settings')">
                <div class="w-[72px] h-[72px] bg-gradient-to-b from-gray-400 to-gray-600 rounded-[18px] flex items-center justify-center shadow-lg active:scale-90 transition">
                    <i data-lucide="settings" class="text-white w-10 h-10"></i>
                </div>
                <span class="text-xs font-medium">Настройки</span>
            </div>
        </div>
    </div>

    <div id="app-runtime"></div>

    <div id="admin-panel" class="absolute inset-0 z-[10000] bg-black/90 backdrop-blur-3xl p-8 hidden flex-col">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-bold">Developer Console</h2>
            <button onclick="GOS.closeAdmin()" class="text-blue-500">Закрыть</button>
        </div>
        <div class="space-y-6">
            <div>
                <label class="text-xs text-gray-500 uppercase ml-2">Версия прошивки</label>
                <input id="upd-v" type="text" placeholder="26.1.0" class="w-full bg-white/10 p-4 rounded-2xl mt-1 outline-none">
            </div>
            <div>
                <label class="text-xs text-gray-500 uppercase ml-2">Что нового</label>
                <textarea id="upd-t" placeholder="Опишите изменения..." class="w-full bg-white/10 p-4 rounded-2xl mt-1 outline-none h-32"></textarea>
            </div>
            <button onclick="GOS.pushUpdate()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold active:scale-95 transition">ОТПРАВИТЬ ОБНОВЛЕНИЕ</button>
        </div>
    </div>

    <div id="home-bar" onclick="GOS.goHome()"></div>
</div>
<script>
const GOS = {
    version: "26.0.0",
    updatePending: null, // Сюда прилетит обновление от админа
    adminClicks: 0,
    activeApp: null,

    init() {
        lucide.createIcons();
        this.statusClock();
        setInterval(() => this.statusClock(), 1000);
    },

    statusClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
        // Можно добавить вывод времени в статус бар, если захочешь
    },

    openApp(id) {
        this.activeApp = id;
        document.body.classList.add('app-open');
        const runtime = document.getElementById('app-runtime');
        
        let appWin = document.getElementById('win-' + id);
        if(!appWin) {
            appWin = document.createElement('div');
            appWin.id = 'win-' + id;
            appWin.className = 'window';
            appWin.innerHTML = this.renderView(id);
            runtime.appendChild(appWin);
        }

        setTimeout(() => {
            appWin.classList.add('active');
            lucide.createIcons();
        }, 10);
    },

    goHome() {
        if(!this.activeApp) return;
        const win = document.getElementById('win-' + this.activeApp);
        win.classList.remove('active');
        document.body.classList.remove('app-open');
        this.activeApp = null;
    },

    // --- ЛОГИКА ОБНОВЛЕНИЙ ---
    
    handleAdminClick() {
        this.adminClicks++;
        if(this.adminClicks >= 5) {
            document.getElementById('admin-panel').style.display = 'flex';
            this.adminClicks = 0;
        }
    },

    closeAdmin() {
        document.getElementById('admin-panel').style.display = 'none';
    },

    pushUpdate() {
        const v = document.getElementById('upd-v').value;
        const t = document.getElementById('upd-t').value;
        if(!v || !t) return alert("Заполни данные!");

        this.updatePending = { version: v, text: t };
        this.closeAdmin();
        
        // Показываем уведомление в Island
        this.showIslandNotif("Обновление ПО", `Доступна GOS ${v}`);
        
        // Если открыты настройки - перерисовываем
        if(this.activeApp === 'settings') {
            document.getElementById('win-settings').innerHTML = this.renderView('settings');
            lucide.createIcons();
        }
    },

    showIslandNotif(title, body) {
        const island = document.getElementById('island');
        const content = document.getElementById('island-content');
        island.classList.add('notif');
        content.classList.remove('opacity-0');
        content.innerHTML = `
            <div class="flex items-center gap-4 h-full">
                <div class="w-12 h-12 bg-blue-500 rounded-2xl flex items-center justify-center shadow-lg">
                    <i data-lucide="download-cloud" class="text-white"></i>
                </div>
                <div>
                    <p class="text-white font-bold text-sm">${title}</p>
                    <p class="text-white/60 text-xs">${body}</p>
                </div>
            </div>
        `;
        lucide.createIcons();
        setTimeout(() => {
            island.classList.remove('notif');
            content.classList.add('opacity-0');
        }, 5000);
    },

    startUpdate() {
        const container = document.getElementById('update-view-content');
        container.innerHTML = `
            <div class="flex flex-col items-center justify-center py-20 text-center">
                <div class="spinner mb-6"></div>
                <h3 class="font-bold text-xl">Подготовка обновления...</h3>
                <p class="text-gray-500 text-sm mt-2">GOS ${this.updatePending.version} скачивается</p>
            </div>
        `;
        
        setTimeout(() => {
            this.version = this.updatePending.version;
            this.updatePending = null;
            this.goHome();
            setTimeout(() => alert("Система обновлена до версии " + this.version), 500);
        }, 5000);
    },

    renderView(id) {
        if(id === 'settings') {
            return `
                <div class="h-full bg-[#F2F2F7] overflow-y-auto">
                    <div class="pt-16 px-6 mb-6">
                        <h1 class="text-4xl font-extrabold">Настройки</h1>
                    </div>

                    <div class="ios-list" onclick="GOS.handleAdminClick()">
                        <div class="ios-item py-4">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-gradient-to-tr from-gray-400 to-gray-200 rounded-full flex items-center justify-center text-white text-2xl font-bold">G</div>
                                <div>
                                    <h3 class="text-lg font-semibold">G-Developer</h3>
                                    <p class="text-xs text-gray-500">Apple ID, iCloud+, Контент и покупки</p>
                                </div>
                            </div>
                            <i data-lucide="chevron-right" class="text-gray-300"></i>
                        </div>
                    </div>

                    <div class="ios-list">
                        <div class="ios-item" onclick="GOS.openApp('software-update')">
                            <div class="flex items-center gap-3">
                                <div class="w-7 h-7 bg-gray-500 rounded-md flex items-center justify-center">
                                    <i data-lucide="refresh-cw" class="text-white w-4 h-4"></i>
                                </div>
                                <span class="text-[17px]">Обновление ПО</span>
                            </div>
                            <div class="flex items-center gap-2">
                                ${this.updatePending ? '<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full animate-pulse">1</span>' : ''}
                                <i data-lucide="chevron-right" class="text-gray-300 w-5 h-5"></i>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        if(id === 'software-update') {
            return `
                <div class="h-full bg-white overflow-y-auto">
                    <div class="pt-14 px-4 flex items-center gap-2 mb-8">
                        <button onclick="GOS.openApp('settings')" class="text-blue-500 flex items-center">
                            <i data-lucide="chevron-left"></i> Настройки
                        </button>
                    </div>
                    
                    <div class="px-8" id="update-view-content">
                        <div class="flex flex-col items-center mb-10">
                            <i data-lucide="refresh-cw" class="w-16 h-16 text-gray-200 mb-4"></i>
                            <h2 class="text-2xl font-bold">GOS ${this.version}</h2>
                            <p class="text-gray-500">Ваше ПО актуально</p>
                        </div>

                        ${this.updatePending ? `
                            <div class="bg-gray-50 rounded-3xl p-6 border border-gray-100">
                                <p class="text-blue-500 font-bold text-xs uppercase mb-2">Доступно обновление</p>
                                <h3 class="text-2xl font-bold mb-4">GOS ${this.updatePending.version}</h3>
                                <div class="text-sm text-gray-600 space-y-2 mb-8">
                                    ${this.updatePending.text.replace(/\n/g, '<br>')}
                                </div>
                                <button onclick="GOS.startUpdate()" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold active:bg-blue-700 transition">Обновить сейчас</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }
    }
};

window.onload = () => GOS.init();
</script>
</body>
</html>
