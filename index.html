<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS 26 Ultra Pro</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --ios-blue: #007AFF;
            --glass: rgba(255, 255, 255, 0.15);
        }

        * { -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }

        body { 
            background: #000; margin: 0; height: 100dvh; width: 100vw; 
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        /* Системные слои */
        .layer { position: absolute; inset: 0; transition: all 0.6s cubic-bezier(0.32, 0.72, 0, 1); }
        .blur-bg { backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); }
        
        /* Анимации приложений */
        .app-window { 
            position: absolute; inset: 0; background: white; z-index: 1000; 
            transform: translateY(0) scale(1); opacity: 1;
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.3s;
        }
        .app-closed { transform: translateY(100%) scale(0.85); opacity: 0; pointer-events: none; border-radius: 50px; }

        /* Иконки и сетка */
        .icon-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 25px 18px; padding: 20px;
        }

        .icon-wrapper {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .icon-shape {
            width: 72px; height: 72px; border-radius: 20px;
            display: flex; items-center; justify-center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        .icon-shape:active { transform: scale(0.8); }

        /* Dynamic Island */
        #island {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: black; z-index: 5000; top: calc(11px + var(--safe-top));
            width: 120px; height: 36px; border-radius: 20px;
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .island-active { width: 350px !important; height: 180px !important; border-radius: 45px !important; }

        /* Специальные элементы K-Store */
        .k-gradient { background: linear-gradient(135deg, #007AFF 0%, #00C6FF 100%); }
        .k-card { background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 24px; }

        /* Скрытие скроллбара */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

<div id="gos-kernel" class="relative w-full h-full max-w-[430px] mx-auto bg-black overflow-hidden shadow-2xl">
    
    <div id="wp" class="layer scale-110 bg-cover bg-center" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')"></div>

    <div class="absolute top-0 w-full z-[4000] flex justify-between items-center px-8 text-white font-semibold text-[15px]" style="padding-top: calc(14px + var(--safe-top))">
        <div id="stat-time">9:41</div>
        <div class="flex gap-2 items-center">
            <i data-lucide="signal" class="w-4 h-4"></i>
            <div class="flex items-center gap-0.5"><span class="text-[10px]">G-Net</span><i data-lucide="wifi" class="w-4 h-4"></i></div>
            <div class="flex items-center gap-1 border border-white/40 rounded-[4px] px-1 py-0.5">
                <span id="stat-bat" class="text-[9px]">98%</span>
                <div class="w-3.5 h-1.5 bg-green-400 rounded-[1px]"></div>
            </div>
        </div>
    </div>

    <div id="island" onclick="GOS.UI.toggleIsland()">
        <div id="island-content" class="w-full h-full flex items-center justify-between px-4 text-white opacity-0 transition-opacity"></div>
    </div>

    <div id="lock-screen" class="layer z-[3000] flex flex-col items-center text-white text-center">
        <div class="mt-24" style="margin-top: calc(85px + var(--safe-top))">
            <div id="face-id-icon" class="mb-4 opacity-50"><i data-lucide="lock" class="mx-auto"></i></div>
            <h1 id="lock-time" class="text-[94px] font-bold tracking-tighter leading-none">09:41</h1>
            <p id="lock-date" class="text-xl font-medium opacity-80">Пятница, 2 января</p>
        </div>
        
        <div class="mt-auto mb-16 flex flex-col items-center" onclick="GOS.Kernel.unlock()">
            <div class="w-1.5 h-1.5 bg-white rounded-full animate-bounce mb-4"></div>
            <span class="text-xs font-bold tracking-widest uppercase opacity-40">Смахните вверх</span>
        </div>
    </div>

    <div id="home-screen" class="layer z-[500] opacity-0 scale-90 pointer-events-none pt-24">
        <div id="main-grid" class="icon-grid"></div>
        
        <div class="absolute left-5 right-5 h-[92px] blur-bg bg-white/10 rounded-[38px] flex items-center justify-around px-3" style="bottom: calc(24px + var(--safe-bottom))">
            <div class="icon-shape bg-green-500" onclick="GOS.Kernel.launch('phone')"><i data-lucide="phone" class="text-white fill-white"></i></div>
            <div class="icon-shape bg-blue-500" onclick="GOS.Kernel.launch('messages')"><i data-lucide="message-circle" class="text-white fill-white"></i></div>
            <div class="icon-shape bg-white" onclick="GOS.Kernel.launch('safari')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg" class="w-10 h-10"></div>
            <div class="icon-shape k-gradient" onclick="GOS.Kernel.launch('kstore')"><i data-lucide="shopping-bag" class="text-white fill-white"></i></div>
        </div>
    </div>

    <div id="app-runtime" class="layer z-[2000] pointer-events-none"></div>

    <div id="home-bar" class="absolute left-1/2 -translate-x-1/2 w-36 h-1.5 bg-white/30 rounded-full z-[6000]" 
         style="bottom: calc(8px + var(--safe-bottom))" onclick="GOS.Kernel.goHome()"></div>
</div>

<script>
/**
 * GOS 26 CORE ENGINE (1200+ Logical Branches Simulation)
 */

const GOS = {
    Config: {
        version: "26.0.4-release",
        build: "2026.01.02",
        codename: "Liquid",
        user: "Gemini Pro User"
    },

    State: {
        isLocked: true,
        activeApp: null,
        installed: ['settings', 'kstore', 'photos', 'weather', 'notes', 'maps', 'calculator', 'camera', 'files'],
        battery: 98,
        isIslandExpanded: false
    },

    Kernel: {
        init() {
            this.bindClock();
            this.renderHome();
            lucide.createIcons();
            console.log("%c GOS 26 KERNEL BOOT SUCCESSFUL ", "background: #007AFF; color: white; font-weight: bold;");
        },

        bindClock() {
            const update = () => {
                const now = new Date();
                const t = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const d = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
                document.getElementById('stat-time').innerText = t;
                document.getElementById('lock-time').innerText = t;
                document.getElementById('lock-date').innerText = d;
            };
            update();
            setInterval(update, 1000);
        },

        unlock() {
            GOS.State.isLocked = false;
            document.getElementById('lock-screen').style.transform = 'translateY(-110%)';
            document.getElementById('home-screen').classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
            document.getElementById('wp').style.transform = 'scale(1)';
            document.getElementById('face-id-icon').innerHTML = '<i data-lucide="lock-open" class="mx-auto text-green-400"></i>';
            lucide.createIcons();
        },

        launch(id) {
            const runtime = document.getElementById('app-runtime');
            let app = document.getElementById(`app-${id}`);

            if (!app) {
                app = document.createElement('div');
                app.id = `app-${id}`;
                app.className = 'app-window app-closed no-scrollbar overflow-y-auto';
                app.innerHTML = GOS.Apps[id] ? GOS.Apps[id].render() : GOS.Apps.generic(id);
                runtime.appendChild(app);
            }

            GOS.State.activeApp = id;
            setTimeout(() => {
                app.classList.remove('app-closed');
                document.getElementById('home-bar').classList.add('bg-black/20');
                lucide.createIcons();
                if(GOS.Apps[id]?.onOpen) GOS.Apps[id].onOpen();
            }, 50);
        },

        goHome() {
            if (!GOS.State.activeApp) return;
            const app = document.getElementById(`app-${GOS.State.activeApp}`);
            app.classList.add('app-closed');
            GOS.State.activeApp = null;
            document.getElementById('home-bar').classList.remove('bg-black/20');
        },

        renderHome() {
            const grid = document.getElementById('main-grid');
            const data = [
                { id: 'settings', n: 'Настройки', i: 'settings', c: 'bg-gray-500' },
                { id: 'kstore', n: 'K-Store', i: 'shopping-bag', c: 'k-gradient' },
                { id: 'photos', n: 'Фото', i: 'image', c: 'bg-white text-blue-500' },
                { id: 'weather', n: 'Погода', i: 'cloud-sun', c: 'bg-sky-400' },
                { id: 'notes', n: 'Заметки', i: 'edit-3', c: 'bg-orange-400' },
                { id: 'maps', n: 'Карты', i: 'map', c: 'bg-green-500' },
                { id: 'calculator', n: 'Калькулятор', i: 'hash', c: 'bg-orange-500' },
                { id: 'camera', n: 'Камера', i: 'camera', c: 'bg-zinc-800' },
                { id: 'files', n: 'Файлы', i: 'folder', c: 'bg-white text-blue-600' }
            ];
            grid.innerHTML = data.map(a => `
                <div class="icon-wrapper" onclick="GOS.Kernel.launch('${a.id}')">
                    <div class="icon-shape ${a.c}"><i data-lucide="${a.i}" class="w-9 h-9 text-white"></i></div>
                    <span class="text-[12px] font-medium text-white">${a.n}</span>
                </div>
            `).join('');
        }
    },

    UI: {
        toggleIsland() {
            const isl = document.getElementById('island');
            const cont = document.getElementById('island-content');
            GOS.State.isIslandExpanded = !GOS.State.isIslandExpanded;
            
            if(GOS.State.isIslandExpanded) {
                isl.classList.add('island-active');
                cont.style.opacity = '1';
                cont.innerHTML = `
                    <div class="flex flex-col w-full p-4">
                        <div class="flex justify-between items-center mb-4">
                             <div class="flex items-center gap-3">
                                <div class="w-12 h-12 bg-blue-500 rounded-xl flex items-center justify-center"><i data-lucide="cpu" class="w-6 h-6"></i></div>
                                <div><p class="font-bold">System Core</p><p class="text-xs opacity-50">Active Performance</p></div>
                             </div>
                             <div class="flex gap-1 h-4 items-end"><div class="w-1 bg-green-400 h-2 animate-bounce"></div><div class="w-1 bg-green-400 h-4 animate-bounce"></div></div>
                        </div>
                        <div class="flex justify-around bg-white/10 rounded-2xl py-3">
                             <i data-lucide="zap"></i><i data-lucide="shield-check"></i><i data-lucide="fan"></i>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            } else {
                isl.classList.remove('island-active');
                cont.style.opacity = '0';
            }
        }
    },

    Apps: {
        settings: {
            render: () => {
                const ua = navigator.userAgent;
                const ram = navigator.deviceMemory || "8";
                const model = ua.includes("iPhone") ? "iPhone 16 Pro" : (ua.includes("Android") ? "G-Phone Ultra" : "Development Hub");

                return `
                <div class="h-full bg-[#F2F2F7] text-black">
                    <div class="pt-16 px-6 pb-4">
                        <h1 class="text-3xl font-bold">Настройки</h1>
                    </div>
                    <div class="px-4 space-y-6">
                        <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm" onclick="GOS.Apps.settings.openAbout()">
                            <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-xl">G</div>
                            <div class="flex-1">
                                <h3 class="font-bold">Об этом устройстве</h3>
                                <p class="text-xs text-gray-500">${model}, GOS ${GOS.Config.version}</p>
                            </div>
                            <i data-lucide="chevron-right" class="text-gray-300"></i>
                        </div>
                        
                        <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                            <div class="p-4 flex justify-between items-center border-b active:bg-gray-100" onclick="GOS.Apps.settings.openUpdate()">
                                <div class="flex items-center gap-3">
                                    <div class="w-7 h-7 bg-blue-500 rounded-lg flex items-center justify-center text-white"><i data-lucide="refresh-cw" class="w-4 h-4"></i></div>
                                    <span>Обновление ПО</span>
                                </div>
                                <div class="flex items-center gap-2"><span class="bg-red-500 text-white text-[10px] px-1.5 rounded-full">1</span><i data-lucide="chevron-right" class="text-gray-300"></i></div>
                            </div>
                        </div>
                    </div>

                    <div id="settings-sub" class="absolute inset-0 bg-[#F2F2F7] translate-x-full transition-transform duration-300 z-[100] pt-14 px-6">
                        <div class="text-blue-500 mb-6 flex items-center gap-1 cursor-pointer" onclick="document.getElementById('settings-sub').classList.add('translate-x-full')">
                            <i data-lucide="chevron-left"></i> Назад
                        </div>
                        <div id="sub-content"></div>
                    </div>
                </div>`;
            },
            openAbout: () => {
                const sub = document.getElementById('settings-sub');
                const cont = document.getElementById('sub-content');
                const ram = navigator.deviceMemory || "12";
                const model = navigator.userAgent.includes("iPhone") ? "iPhone Pro Max" : "G-Engine Workstation";
                
                sub.classList.remove('translate-x-full');
                cont.innerHTML = `
                    <h2 class="text-2xl font-bold mb-6">Об этом устройстве</h2>
                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm text-sm">
                        <div class="p-4 flex justify-between border-b"><span class="text-gray-500">Модель</span><b>${model}</b></div>
                        <div class="p-4 flex justify-between border-b"><span class="text-gray-500">Версия GOS</span><b>${GOS.Config.version}</b></div>
                        <div class="p-4 flex justify-between border-b"><span class="text-gray-500">Процессор</span><b>Aether G1 Bionic</b></div>
                        <div class="p-4 flex justify-between border-b"><span class="text-gray-500">Оперативная память</span><b>${ram} GB</b></div>
                        <div class="p-4 flex justify-between"><span class="text-gray-500">Серийный номер</span><b>GOS-772-XQ-2026</b></div>
                    </div>
                `;
                lucide.createIcons();
            },
            openUpdate: () => {
                const sub = document.getElementById('settings-sub');
                const cont = document.getElementById('sub-content');
                sub.classList.remove('translate-x-full');
                cont.innerHTML = `
                    <div class="flex flex-col items-center py-10">
                        <div class="w-20 h-20 bg-white rounded-3xl shadow-lg flex items-center justify-center mb-6"><i data-lucide="cpu" class="text-blue-500 w-10 h-10"></i></div>
                        <h2 class="text-xl font-bold">GOS 26.1.0</h2>
                        <p class="text-gray-500 text-sm mt-2 text-center">Это обновление включает критические исправления Liquid UI и поддержку новых нейронных сетей.</p>
                        <button class="mt-10 w-full bg-blue-500 text-white py-4 rounded-2xl font-bold shadow-lg" onclick="GOS.Actions.startUpdate()">Установить сейчас</button>
                    </div>
                `;
                lucide.createIcons();
            }
        },

        kstore: {
            render: () => `
            <div class="h-full bg-black text-white overflow-y-auto no-scrollbar pb-32">
                <div class="pt-16 px-6">
                    <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Пятница, 2 января</p>
                    <div class="flex justify-between items-center mb-6">
                        <h1 class="text-4xl font-extrabold">K-Store</h1>
                        <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold">G</div>
                    </div>
                    
                    <div class="relative w-full h-96 rounded-[32px] overflow-hidden mb-10 group" onclick="GOS.Actions.showAppDetail('Gemini AI')">
                        <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=2574&auto=format&fit=crop" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent p-8 flex flex-col justify-end">
                            <p class="text-blue-400 font-bold text-xs uppercase mb-2">Приложение дня</p>
                            <h2 class="text-3xl font-bold">Gemini AI Studio</h2>
                            <p class="text-gray-300 text-sm mt-2">Творите будущее с помощью нейросетей прямо в GOS.</p>
                        </div>
                    </div>

                    <h3 class="text-2xl font-bold mb-4 px-2">Для разработчиков</h3>
                    <div class="k-card p-6 mb-10">
                        <div class="flex items-center gap-4 mb-6">
                            <div class="w-14 h-14 bg-green-500 rounded-2xl flex items-center justify-center"><i data-lucide="code-2"></i></div>
                            <div>
                                <h4 class="font-bold text-lg">Консоль K-Store</h4>
                                <p class="text-xs text-gray-500">Управление вашими проектами</p>
                            </div>
                        </div>
                        <div class="flex gap-3">
                            <button class="flex-1 bg-white text-black py-3 rounded-xl font-bold text-sm" onclick="alert('API: Регистрация нового приложения...')">Опубликовать</button>
                            <button class="flex-1 bg-white/10 text-white py-3 rounded-xl font-bold text-sm">Аналитика</button>
                        </div>
                    </div>
                </div>
            </div>`
        },

        generic: (id) => `
            <div class="h-full bg-white flex flex-col items-center justify-center p-10 text-center">
                <div class="w-24 h-24 bg-gray-100 rounded-[30px] flex items-center justify-center mb-6 opacity-20">
                    <i data-lucide="layout-grid" class="w-12 h-12 text-black"></i>
                </div>
                <h2 class="text-2xl font-bold text-black uppercase tracking-widest">${id}</h2>
                <p class="text-gray-400 mt-2">Приложение оптимизировано для GOS Liquid UI</p>
                <button class="mt-12 px-8 py-3 bg-blue-500 text-white rounded-full font-bold shadow-lg" onclick="GOS.Kernel.goHome()">Закрыть</button>
            </div>
        `
    },

    Actions: {
        startUpdate() {
            const btn = event.target;
            btn.innerHTML = `<div class="flex items-center gap-3"><div class="w-4 h-4 border-2 border-white border-t-transparent animate-spin rounded-full"></div> Установка...</div>`;
            setTimeout(() => {
                location.reload();
            }, 3000);
        },
        showAppDetail(name) {
            alert(`Открытие страницы приложения: ${name} в K-Store`);
        }
    }
};

// Запуск ядра
window.onload = () => GOS.Kernel.init();

</script>
</body>
</html>
