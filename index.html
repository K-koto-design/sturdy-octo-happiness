<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS 26 Pro | Developer Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        :root { --ios-blue: #007AFF; --safe-top: env(safe-area-inset-top, 20px); --safe-bottom: env(safe-area-inset-bottom, 20px); }
        * { -webkit-tap-highlight-color: transparent; user-select: none; touch-action: pan-x pan-y; font-family: -apple-system, system-ui, sans-serif; }
        body { background: #000; margin: 0; height: 100dvh; overflow: hidden; color: white; }

        #os-root { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; background: #000; overflow: hidden; }
        .layer { position: absolute; inset: 0; transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        #wp { background: linear-gradient(135deg, #0f172a 0%, #000 100%); z-index: 5; }

        /* Dynamic Island */
        #island {
            position: absolute; left: 50%; transform: translateX(-50%);
            background: #000; z-index: 9999; top: calc(11px + var(--safe-top));
            width: 120px; height: 36px; border-radius: 20px;
            transition: all 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #island.notif { width: 360px; height: 80px; border-radius: 32px; background: #1a1a1a; border: 1px solid #333; }

        /* Apps */
        .app-win { position: absolute; inset: 0; z-index: 2000; background: #fff; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.32, 0.72, 0, 1); visibility: hidden; }
        .app-win.open { transform: translateY(0); visibility: visible; }

        /* Update Screen */
        #update-screen { position: absolute; inset: 0; background: #000; z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .progress-bar { width: 200px; height: 3px; background: #333; border-radius: 5px; margin-top: 40px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #fff; transition: width 0.1s; }

        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px 15px; padding: 20px; }
        .icon-box { width: 72px; height: 72px; border-radius: 18px; display: flex; items-center; justify-center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
        .icon-box:active { transform: scale(0.85); }

        #home-bar { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 140px; height: 5px; background: rgba(255, 255, 255, 0.3); border-radius: 10px; z-index: 10000; }
        
        .badge { position: absolute; top: -5px; right: -5px; width: 22px; height: 22px; background: #ff3b30; border-radius: 50%; color: white; font-size: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid white; }
    </style>
</head>
<body>

<div id="os-root">
    <div id="wp" class="layer"></div>

    <div id="island">
        <div id="island-content" class="w-full h-full opacity-0 transition-opacity duration-300"></div>
    </div>

    <div id="lock-screen" class="layer z-[8000] flex flex-col items-center justify-between py-20 bg-black/40">
        <div class="mt-12 text-center">
            <h1 id="big-clock" class="text-8xl font-bold tracking-tighter">09:41</h1>
            <p class="text-xl opacity-80">Пятница, 2 января</p>
        </div>
        <button onclick="GOS.Kernel.unlock()" class="mb-10 animate-pulse text-[10px] tracking-[0.3em] uppercase">Вход</button>
    </div>

    <div id="home-screen" class="layer z-[1000] opacity-0 scale-95 pointer-events-none pt-28 px-4">
        <div id="home-grid" class="app-grid"></div>
        
        <div class="absolute bottom-10 left-5 right-5 h-[90px] bg-white/10 backdrop-blur-3xl rounded-[35px] flex items-center justify-around px-2 border border-white/10">
            <div class="icon-box bg-blue-500 relative" onclick="GOS.Kernel.launch('settings')">
                <i data-lucide="settings" class="text-white"></i>
                <div id="settings-badge" class="badge hidden">1</div>
            </div>
            <div class="icon-box bg-green-500" onclick="GOS.Kernel.launch('phone')"><i data-lucide="phone" class="text-white fill-current"></i></div>
            <div class="icon-box bg-white" onclick="GOS.Kernel.launch('safari')"><img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg" class="w-10 h-10"></div>
        </div>
    </div>

    <div id="update-screen">
        <i data-lucide="apple" class="w-16 h-16 text-white mb-4"></i>
        <div class="progress-bar"><div id="p-fill" class="progress-fill"></div></div>
    </div>

    <div id="admin-panel" class="absolute inset-0 bg-zinc-950 z-[9999] p-8 hidden flex-col gap-6 overflow-y-auto">
        <div class="flex justify-between items-center">
            <h2 class="text-2xl font-bold">Dev Center</h2>
            <button onclick="document.getElementById('admin-panel').style.display='none'" class="text-blue-500">Выход</button>
        </div>
        
        <div class="bg-zinc-900 p-4 rounded-2xl space-y-4">
            <p class="text-sm font-bold text-blue-400 uppercase">Системное обновление</p>
            <input id="upd-version" type="text" placeholder="Версия (напр. 26.1.0)" class="w-full bg-black/50 p-3 rounded-lg border border-white/10 outline-none">
            <textarea id="upd-desc" placeholder="Что нового в этой версии?" class="w-full bg-black/50 p-3 rounded-lg border border-white/10 outline-none h-20"></textarea>
            <button onclick="GOS.Admin.pushUpdate()" class="w-full bg-blue-600 py-3 rounded-xl font-bold">ВЫПУСТИТЬ ОБНОВЛЕНИЕ</button>
        </div>

        <div class="bg-zinc-900 p-4 rounded-2xl space-y-4">
            <p class="text-sm font-bold text-orange-400 uppercase">Push-уведомление</p>
            <input id="adm-title" type="text" placeholder="Заголовок" class="w-full bg-black/50 p-3 rounded-lg border border-white/10">
            <button onclick="GOS.Admin.sendSms()" class="w-full bg-orange-600 py-3 rounded-xl font-bold">ОТПРАВИТЬ ВСЕМ</button>
        </div>
    </div>

    <div id="app-runtime" class="layer z-[5000] pointer-events-none text-black"></div>
    <div id="home-bar" onclick="GOS.Kernel.goHome()"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBzyW42d5u12X_9Rte8aLYPF9N35GLcsEc",
    authDomain: "gos-os.firebaseapp.com",
    projectId: "gos-os",
    storageBucket: "gos-os.firebasestorage.app",
    messagingSenderId: "40397813604",
    appId: "1:40397813604:web:a35ad1b12cac8b40efec71",
    measurementId: "G-PMGD2XQ1M7",
    databaseURL: "https://gos-os-default-rtdb.firebaseio.com" // Пример URL
};

const GOS = {
    version: "26.0.4",
    newUpdate: null,
    secretClicks: 0,

    Kernel: {
        init() {
            firebase.initializeApp(firebaseConfig);
            this.initUpdateListener();
            this.renderApps();
            setInterval(() => {
                const now = new Date();
                document.getElementById('big-clock').innerText = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            }, 1000);
            lucide.createIcons();
        },

        initUpdateListener() {
            const db = firebase.database().ref('system_update');
            db.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data && data.version !== GOS.version) {
                    GOS.newUpdate = data;
                    document.getElementById('settings-badge').classList.remove('hidden');
                    GOS.UI.Island.notify("Обновление ПО", `Доступна GOS ${data.version}`, "download-cloud");
                }
            });
        },

        unlock() {
            document.getElementById('lock-screen').style.transform = 'translateY(-100%)';
            document.getElementById('home-screen').classList.replace('opacity-0', 'opacity-1');
            document.getElementById('home-screen').classList.remove('pointer-events-none', 'scale-95');
        },

        launch(id) {
            const rt = document.getElementById('app-runtime');
            let win = document.getElementById(`win-${id}`);
            if(!win) {
                win = document.createElement('div');
                win.id = `win-${id}`;
                win.className = 'app-win';
                win.innerHTML = GOS.Views[id]();
                rt.appendChild(win);
            }
            GOS.activeApp = id;
            win.classList.add('open');
            lucide.createIcons();
        },

        goHome() {
            if(!GOS.activeApp) return;
            document.getElementById(`win-${GOS.activeApp}`).classList.remove('open');
            GOS.activeApp = null;
        },

        renderApps() {
            const apps = [{ id: 'kstore', n: 'K-Store', i: 'shopping-bag', c: 'bg-blue-600' }];
            document.getElementById('home-grid').innerHTML = apps.map(a => `
                <div class="flex flex-col items-center gap-2" onclick="GOS.Kernel.launch('${a.id}')">
                    <div class="icon-box ${a.c} shadow-xl"><i data-lucide="${a.i}" class="text-white"></i></div>
                    <span class="text-[12px] font-medium text-white">${a.n}</span>
                </div>
            `).join('');
        }
    },

    Admin: {
        pushUpdate() {
            const v = document.getElementById('upd-version').value;
            const d = document.getElementById('upd-desc').value;
            if(!v) return;
            firebase.database().ref('system_update').set({ version: v, desc: d });
            alert("Обновление разослано на все устройства!");
        },
        sendSms() {
            const t = document.getElementById('adm-title').value;
            GOS.UI.Island.notify("System", t, "message-circle");
        }
    },

    UI: {
        Island: {
            notify(title, body, icon) {
                const isl = document.getElementById('island');
                const cont = document.getElementById('island-content');
                isl.classList.add('notif');
                cont.classList.replace('opacity-0', 'opacity-1');
                cont.innerHTML = `<div class="flex items-center gap-4 px-6 h-full text-white">
                    <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center"><i data-lucide="${icon}"></i></div>
                    <div class="flex-1 truncate text-left"><p class="font-bold text-sm">${title}</p><p class="text-xs opacity-60">${body}</p></div>
                </div>`;
                lucide.createIcons();
                setTimeout(() => { isl.classList.remove('notif'); cont.classList.replace('opacity-1', 'opacity-0'); }, 5000);
            }
        },
        installUpdate() {
            document.getElementById(`win-settings`).classList.remove('open');
            document.getElementById('update-screen').style.display = 'flex';
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 2;
                document.getElementById('p-fill').style.width = p + '%';
                if(p >= 100) {
                    clearInterval(interval);
                    GOS.version = GOS.newUpdate.version;
                    location.reload(); // Перезагрузка для применения
                }
            }, 100);
        }
    },

    Views: {
        settings: () => `
            <div class="h-full bg-[#F2F2F7] p-6 pt-16 overflow-y-auto">
                <h1 class="text-3xl font-bold mb-6">Настройки</h1>
                <div class="bg-white rounded-2xl p-4 flex items-center gap-4 mb-6 shadow-sm" onclick="GOS.secretClicks++; if(GOS.secretClicks>=5){document.getElementById('admin-panel').style.display='flex'; GOS.secretClicks=0;}">
                    <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl">D</div>
                    <div class="flex-1"><p class="font-bold">Developer</p><p class="text-xs text-gray-400">G-ID & Cloud Sync</p></div>
                </div>

                <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                    <div class="p-4 border-b flex justify-between items-center" onclick="GOS.UI.showUpdatePage()">
                        <div class="flex items-center gap-3"><div class="w-7 h-7 bg-gray-400 rounded flex items-center justify-center text-white"><i data-lucide="refresh-cw" class="w-4 h-4"></i></div><span>Обновление ПО</span></div>
                        <div class="flex items-center gap-2">
                            ${GOS.newUpdate ? '<span class="w-2 h-2 bg-red-500 rounded-full"></span>' : ''}
                            <i data-lucide="chevron-right" class="text-gray-300 w-4 h-4"></i>
                        </div>
                    </div>
                </div>

                ${GOS.newUpdate ? `
                <div class="mt-6 bg-white rounded-2xl p-6 text-center">
                    <p class="text-sm text-gray-500 mb-1">Доступна GOS ${GOS.newUpdate.version}</p>
                    <p class="text-xs text-gray-400 mb-4">${GOS.newUpdate.desc}</p>
                    <button onclick="GOS.UI.installUpdate()" class="text-blue-500 font-bold">Обновить сейчас</button>
                </div>
                ` : ''}
            </div>`,
        kstore: () => `<div class="h-full bg-white p-6 pt-16"><h1 class="text-4xl font-bold">K-Store</h1></div>`
    }
};

GOS.UI.showUpdatePage = () => { alert("Версия: " + GOS.version + "\nНовая версия: " + (GOS.newUpdate ? GOS.newUpdate.version : "Нет")); };

window.onload = () => GOS.Kernel.init();
</script>
</body>
</html>
