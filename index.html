<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AetherOS 26 | Liquid Edition</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['-apple-system', 'SF Pro Display', 'system-ui', 'sans-serif'] },
                    colors: {
                        ios: {
                            blue: '#007AFF',
                            green: '#34C759',
                            red: '#FF3B30',
                            glass: 'rgba(255, 255, 255, 0.15)'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        body { 
            margin: 0; 
            background-color: #000; 
            height: 100vh; 
            width: 100vw; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden;
            touch-action: none;
        }

        #screen {
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 932px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        @media (min-width: 768px) {
            #screen {
                border-radius: 55px;
                height: 880px;
                width: 400px;
                border: 12px solid #1a1a1a;
                box-shadow: 0 0 100px rgba(0,0,0,0.5);
            }
        }

        /* Glassmorphism Classes */
        .liquid-blur {
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            background: rgba(255, 255, 255, 0.12);
            border: 0.5px solid rgba(255, 255, 255, 0.2);
        }

        .liquid-dark {
            backdrop-filter: blur(50px) saturate(150%);
            -webkit-backdrop-filter: blur(50px) saturate(150%);
            background: rgba(0, 0, 0, 0.6);
            border-top: 0.5px solid rgba(255, 255, 255, 0.1);
        }

        /* App Transitions */
        .app-window {
            transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.4s ease, border-radius 0.6s ease;
        }

        .app-minimized {
            transform: translateY(100%) scale(0.8);
            opacity: 0;
            pointer-events: none;
        }

        /* Dynamic Island Morphing */
        #island {
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        /* Animations */
        @keyframes float { 0% { transform: translateY(0); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0); } }
        .floating { animation: float 4s ease-in-out infinite; }

        .ios-icon {
            transition: transform 0.2s cubic-bezier(0.33, 1, 0.68, 1);
        }
        .ios-icon:active { transform: scale(0.85); }
    </style>
</head>
<body>

    <div id="screen" class="relative select-none">
        
        <div id="wp-layer" class="absolute inset-0 bg-cover bg-center transition-transform duration-[2s] scale-110" 
             style="background-image: url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop');">
            <div class="absolute inset-0 bg-black/10"></div>
        </div>

        <div class="absolute top-0 w-full z-[1000] flex justify-between items-center px-8 text-white font-semibold text-[15px]" 
             style="padding-top: calc(12px + var(--safe-top))">
            <span id="sys-clock">00:00</span>
            <div class="flex gap-1.5 items-center">
                <i data-lucide="signal" class="w-4 h-4"></i>
                <i data-lucide="wifi" class="w-4 h-4"></i>
                <div class="flex items-center gap-0.5">
                    <span class="text-[11px] mr-0.5">84%</span>
                    <i data-lucide="battery" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <div id="island" class="absolute left-1/2 -translate-x-1/2 bg-black z-[1100] flex items-center justify-center overflow-hidden cursor-pointer"
             style="top: calc(11px + var(--safe-top)); width: 124px; height: 37px; border-radius: 20px;"
             onclick="Island.handleTap()">
            <div id="island-inner" class="w-full h-full flex items-center justify-between px-3 text-white transition-opacity duration-300">
                </div>
        </div>

        <div id="ls" class="absolute inset-0 z-[500] flex flex-col items-center text-white transition-all duration-700 ease-out">
            <div class="mt-24 text-center" style="margin-top: calc(85px + var(--safe-top))">
                <p id="ls-date" class="text-[22px] font-medium opacity-90 mb-1">суббота, 3 января</p>
                <h1 id="ls-clock" class="text-[100px] font-bold tracking-tight leading-none">00:00</h1>
            </div>

            <div class="mt-8 w-full px-5 space-y-3 max-h-[400px] overflow-hidden">
                <div class="liquid-blur rounded-[28px] p-4 flex items-center gap-4 animate-[fadeIn_0.5s_ease]">
                    <div class="w-11 h-11 bg-ios-blue rounded-full flex items-center justify-center shadow-lg">
                        <i data-lucide="message-circle" class="w-6 h-6"></i>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h4 class="font-bold text-sm">Sarah</h4>
                            <span class="text-[10px] opacity-60">Just now</span>
                        </div>
                        <p class="text-[13px] opacity-80 leading-tight">Can't wait for AetherOS 26! 🚀</p>
                    </div>
                </div>
            </div>

            <div class="mt-auto mb-16 flex flex-col items-center" onclick="Kernel.unlock()">
                <div class="w-1 h-1 bg-white rounded-full mb-4 animate-bounce"></div>
                <p class="text-[13px] font-semibold tracking-wider opacity-60">SWIPE UP TO UNLOCK</p>
            </div>

            <div class="absolute bottom-12 w-full px-12 flex justify-between" style="bottom: calc(52px + var(--safe-bottom))">
                <div class="w-12 h-12 liquid-blur rounded-full flex items-center justify-center active:scale-90 transition cursor-pointer">
                    <i data-lucide="flashlight" class="w-5 h-5"></i>
                </div>
                <div class="w-12 h-12 liquid-blur rounded-full flex items-center justify-center active:scale-90 transition cursor-pointer">
                    <i data-lucide="camera" class="w-5 h-5"></i>
                </div>
            </div>
        </div>

        <div id="hs" class="absolute inset-0 z-[400] pt-28 px-6 opacity-0 scale-95 pointer-events-none transition-all duration-500">
            <div id="app-grid" class="grid grid-cols-4 gap-x-4 gap-y-8">
                </div>

            <div class="absolute left-5 right-5 h-[92px] liquid-blur rounded-[38px] flex items-center justify-around px-3" 
                 style="bottom: calc(24px + var(--safe-bottom))">
                <div onclick="Kernel.launch('phone')" class="ios-icon w-16 h-16 bg-gradient-to-b from-[#5af37a] to-[#34c759] rounded-[18px] flex items-center justify-center shadow-lg cursor-pointer">
                    <i data-lucide="phone" class="text-white fill-white w-8 h-8"></i>
                </div>
                <div onclick="Kernel.launch('messages')" class="ios-icon w-16 h-16 bg-gradient-to-b from-[#5af37a] to-[#34c759] rounded-[18px] flex items-center justify-center shadow-lg cursor-pointer">
                    <i data-lucide="message-square" class="text-white fill-white w-8 h-8"></i>
                </div>
                <div onclick="Kernel.launch('safari')" class="ios-icon w-16 h-16 bg-white rounded-[18px] flex items-center justify-center shadow-lg cursor-pointer overflow-hidden">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg" class="w-12 h-12" alt="safari">
                </div>
                <div onclick="Kernel.launch('music')" class="ios-icon w-16 h-16 bg-gradient-to-br from-[#fb516e] to-[#ff2d55] rounded-[18px] flex items-center justify-center shadow-lg cursor-pointer">
                    <i data-lucide="music" class="text-white fill-white w-8 h-8"></i>
                </div>
            </div>
        </div>

        <div id="app-runtime" class="absolute inset-0 z-[600] pointer-events-none">
            </div>

        <div id="home-indicator" class="absolute left-1/2 -translate-x-1/2 w-36 h-1.5 bg-white/40 rounded-full z-[2000] cursor-pointer hover:bg-white/80 transition-all"
             style="bottom: calc(8px + var(--safe-bottom))" onclick="Kernel.minimize()"></div>
    </div>

    <script>
        /* -------------------------------------------------------------------------
           OS KERNEL: The Brain of AetherOS
        ------------------------------------------------------------------------- */
        const Kernel = {
            state: {
                isLocked: true,
                activeApp: null,
                runningApps: new Set(),
                time: new Date()
            },

            init() {
                this.updateClock();
                setInterval(() => this.updateClock(), 1000);
                this.renderAppGrid();
                lucide.createIcons();
                
                // PWA Context Menu disable
                window.oncontextmenu = (e) => { e.preventDefault(); e.stopPropagation(); return false; };
            },

            updateClock() {
                this.state.time = new Date();
                const timeStr = this.state.time.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
                const dateStr = this.state.time.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
                
                document.getElementById('sys-clock').innerText = timeStr;
                document.getElementById('ls-clock').innerText = timeStr;
                document.getElementById('ls-date').innerText = dateStr;
            },

            unlock() {
                if (!this.state.isLocked) return;
                this.state.isLocked = false;
                
                const ls = document.getElementById('ls');
                const hs = document.getElementById('hs');
                const wp = document.getElementById('wp-layer');

                ls.style.transform = 'translateY(-110%) scale(1.1)';
                ls.style.opacity = '0';
                
                hs.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                hs.classList.add('opacity-100', 'scale-100');
                
                wp.style.transform = 'scale(1)';
            },

            launch(appId) {
                const app = Registry[appId];
                if (!app) return;

                const runtime = document.getElementById('app-runtime');
                let appEl = document.getElementById(`app-win-${appId}`);

                if (!appEl) {
                    appEl = document.createElement('div');
                    appEl.id = `app-win-${appId}`;
                    appEl.className = 'app-window absolute inset-0 bg-black app-minimized z-[600] pointer-events-auto rounded-[50px] overflow-hidden';
                    appEl.innerHTML = app.template();
                    runtime.appendChild(appEl);
                    if (app.onLaunch) app.onLaunch(appEl);
                }

                this.state.activeApp = appId;
                this.state.runningApps.add(appId);

                // Open Animation
                requestAnimationFrame(() => {
                    appEl.classList.remove('app-minimized');
                    appEl.style.borderRadius = "0px";
                    appEl.style.transform = "translateY(0) scale(1)";
                    appEl.style.opacity = "1";
                    document.getElementById('home-indicator').style.backgroundColor = app.indicatorColor || "rgba(255,255,255,0.4)";
                });

                lucide.createIcons();
            },

            minimize() {
                if (!this.state.activeApp) return;
                
                const appId = this.state.activeApp;
                const appEl = document.getElementById(`app-win-${appId}`);
                
                appEl.classList.add('app-minimized');
                appEl.style.borderRadius = "55px";
                document.getElementById('home-indicator').style.backgroundColor = "rgba(255,255,255,0.4)";
                
                this.state.activeApp = null;
            },

            renderAppGrid() {
                const grid = document.getElementById('app-grid');
                const apps = [
                    { id: 'photos', name: 'Фото', icon: 'image', color: 'bg-white text-blue-500' },
                    { id: 'camera', name: 'Камера', icon: 'camera', color: 'bg-zinc-800 text-white' },
                    { id: 'settings', name: 'Настройки', icon: 'settings', color: 'bg-zinc-500 text-white' },
                    { id: 'calendar', name: 'Календарь', icon: 'calendar', color: 'bg-white text-red-500' },
                    { id: 'notes', name: 'Заметки', icon: 'edit-3', color: 'bg-yellow-100 text-yellow-600' },
                    { id: 'maps', name: 'Карты', icon: 'map', color: 'bg-emerald-100 text-emerald-600' },
                    { id: 'health', name: 'Здоровье', icon: 'heart', color: 'bg-white text-rose-500' },
                    { id: 'wallet', name: 'Wallet', icon: 'credit-card', color: 'bg-zinc-900 text-white' }
                ];

                grid.innerHTML = apps.map(app => `
                    <div class="flex flex-col items-center gap-1.5 cursor-pointer" onclick="Kernel.launch('${app.id}')">
                        <div class="ios-icon w-[72px] h-[72px] ${app.color} rounded-[20px] flex items-center justify-center shadow-lg">
                            <i data-lucide="${app.icon}" class="w-9 h-9"></i>
                        </div>
                        <span class="text-[12px] font-medium text-white">${app.name}</span>
                    </div>
                `).join('');
            }
        };

        /* -------------------------------------------------------------------------
           DYNAMIC ISLAND: Smart Overlay System
        ------------------------------------------------------------------------- */
        const Island = {
            state: 'idle', // idle, expanded, mini
            timer: null,

            update(content, type = 'mini') {
                const island = document.getElementById('island');
                const inner = document.getElementById('island-inner');

                if (type === 'mini') {
                    island.style.width = "180px";
                    inner.innerHTML = content;
                }
                inner.style.opacity = "1";
                lucide.createIcons();
            },

            handleTap() {
                const island = document.getElementById('island');
                if (this.state === 'expanded') {
                    island.style.width = "124px";
                    island.style.height = "37px";
                    this.state = 'idle';
                } else {
                    island.style.width = "350px";
                    island.style.height = "180px";
                    island.style.borderRadius = "45px";
                    this.state = 'expanded';
                    this.renderExpanded();
                }
            },

            renderExpanded() {
                const inner = document.getElementById('island-inner');
                inner.innerHTML = `
                    <div class="w-full p-6 flex flex-col justify-between h-full">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-4">
                                <div class="w-14 h-14 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                                    <i data-lucide="music" class="w-8 h-8"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-lg leading-tight">Starboy</h4>
                                    <p class="opacity-60 text-sm">The Weeknd</p>
                                </div>
                            </div>
                            <div class="flex gap-1 h-4 items-end">
                                <div class="w-1 bg-ios-green h-2 animate-bounce"></div>
                                <div class="w-1 bg-ios-green h-4 animate-bounce" style="animation-delay: 0.2s"></div>
                                <div class="w-1 bg-ios-green h-3 animate-bounce" style="animation-delay: 0.4s"></div>
                            </div>
                        </div>
                        <div class="flex justify-around items-center">
                            <i data-lucide="skip-back" class="w-8 h-8 fill-current"></i>
                            <i data-lucide="pause" class="w-10 h-10 fill-current"></i>
                            <i data-lucide="skip-forward" class="w-8 h-8 fill-current"></i>
                        </div>
                    </div>
                `;
                lucide.createIcons();
            }
        };

        /* -------------------------------------------------------------------------
           APP REGISTRY: Functional Application Definitions
        ------------------------------------------------------------------------- */
        const Registry = {
            'music': {
                indicatorColor: "rgba(255,255,255,0.8)",
                template: () => `
                    <div class="h-full bg-gradient-to-b from-zinc-800 to-black p-8 pt-20 flex flex-col text-white">
                        <div class="w-full aspect-square bg-zinc-700 rounded-3xl shadow-2xl mb-10 overflow-hidden floating">
                            <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=2670&auto=format&fit=crop" class="w-full h-full object-cover">
                        </div>
                        <div class="mb-10">
                            <h1 class="text-3xl font-bold mb-1">Starboy</h1>
                            <p class="text-xl opacity-60">The Weeknd</p>
                        </div>
                        <div class="w-full h-1.5 bg-white/10 rounded-full mb-2">
                            <div class="w-1/3 h-full bg-white rounded-full relative">
                                <div class="absolute right-0 top-1/2 -translate-y-1/2 w-4 h-4 bg-white rounded-full shadow-lg"></div>
                            </div>
                        </div>
                        <div class="flex justify-between text-xs opacity-40 mb-10">
                            <span>1:24</span>
                            <span>3:50</span>
                        </div>
                        <div class="flex justify-around items-center px-4">
                            <i data-lucide="shuffle" class="w-6 h-6 opacity-40"></i>
                            <i data-lucide="skip-back" class="w-10 h-10 fill-current"></i>
                            <i data-lucide="play" class="w-14 h-14 fill-current"></i>
                            <i data-lucide="skip-forward" class="w-10 h-10 fill-current"></i>
                            <i data-lucide="repeat" class="w-6 h-6 opacity-40"></i>
                        </div>
                    </div>
                `
            },

            'messages': {
                indicatorColor: "rgba(0,0,0,0.2)",
                template: () => `
                    <div class="h-full bg-white text-black flex flex-col">
                        <div class="pt-16 pb-4 px-6 liquid-blur sticky top-0 z-10 flex items-center justify-between">
                            <h1 class="text-3xl font-bold">Сообщения</h1>
                            <i data-lucide="edit" class="text-ios-blue"></i>
                        </div>
                        <div class="flex-1 overflow-y-auto px-4 pt-4 space-y-6">
                            <div class="flex gap-4 items-center">
                                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-orange-400 to-red-500"></div>
                                <div class="flex-1 border-b border-gray-100 pb-4">
                                    <div class="flex justify-between mb-1">
                                        <span class="font-bold text-lg">Sarah</span>
                                        <span class="text-sm opacity-40">10:24</span>
                                    </div>
                                    <p class="text-gray-500 line-clamp-1">Can't wait for AetherOS 26! 🚀</p>
                                </div>
                            </div>
                            <div class="flex gap-4 items-center">
                                <div class="w-14 h-14 rounded-full bg-gradient-to-br from-blue-400 to-indigo-500"></div>
                                <div class="flex-1 border-b border-gray-100 pb-4">
                                    <div class="flex justify-between mb-1">
                                        <span class="font-bold text-lg">Alex</span>
                                        <span class="text-sm opacity-40">Вчера</span>
                                    </div>
                                    <p class="text-gray-500 line-clamp-1">Meeting moved to 3 PM.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },

            'safari': {
                indicatorColor: "rgba(0,0,0,0.1)",
                template: () => `
                    <div class="h-full bg-white flex flex-col">
                        <div class="flex-1 bg-gray-50 flex items-center justify-center">
                             <div class="text-center opacity-20">
                                <i data-lucide="compass" class="w-24 h-24 mx-auto mb-4"></i>
                                <p class="text-xl font-medium">Aether Search</p>
                             </div>
                        </div>
                        <div class="p-4 bg-gray-100/80 backdrop-blur-xl border-t border-gray-200">
                            <div class="bg-white rounded-2xl h-12 flex items-center px-4 gap-3 shadow-sm">
                                <i data-lucide="lock" class="w-4 h-4 opacity-30"></i>
                                <span class="text-gray-400">apple.com</span>
                                <i data-lucide="rotate-cw" class="w-4 h-4 ml-auto opacity-30"></i>
                            </div>
                            <div class="flex justify-between mt-4 px-4 pb-4">
                                <i data-lucide="chevron-left" class="opacity-20"></i>
                                <i data-lucide="chevron-right" class="opacity-20"></i>
                                <i data-lucide="share" class="text-ios-blue"></i>
                                <i data-lucide="book-open" class="text-ios-blue"></i>
                                <i data-lucide="copy" class="text-ios-blue"></i>
                            </div>
                        </div>
                    </div>
                `
            }
        };

        // Standard renderer for generic apps
        ['photos', 'camera', 'settings', 'calendar', 'notes', 'maps', 'health', 'wallet', 'phone'].forEach(id => {
            if (!Registry[id]) {
                Registry[id] = {
                    template: () => `
                        <div class="h-full bg-neutral-900 flex flex-col items-center justify-center text-white">
                            <i data-lucide="layout" class="w-20 h-20 opacity-10 mb-6"></i>
                            <h2 class="text-2xl font-bold opacity-30">${id.toUpperCase()}</h2>
                        </div>
                    `
                };
            }
        });

        /* -------------------------------------------------------------------------
           BOOTSTRAP
        ------------------------------------------------------------------------- */
        Kernel.init();

    </script>
</body>
</html>
