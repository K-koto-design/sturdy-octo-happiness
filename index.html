<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS 26 Ultimate</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --ios-blue: #007AFF;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { 
            -webkit-tap-highlight-color: transparent; 
            user-select: none; 
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        body { background: #000; margin: 0; overflow: hidden; height: 100dvh; color: white; }

        /* Контейнер устройства */
        #iphone-frame {
            position: relative;
            width: 100%; height: 100%;
            max-width: 430px; margin: 0 auto;
            background: #000;
            overflow: hidden;
        }

        /* Обои с параллаксом */
        #wallpaper {
            position: absolute; inset: -20px;
            background: url('https://images.unsplash.com/photo-1620206343767-7da98185edd4?q=80&w=1920&auto=format&fit=crop') center/cover;
            z-index: 1; transition: filter 0.5s ease, transform 0.5s ease;
        }
        .blur-bg #wallpaper { filter: blur(30px) brightness(0.6); transform: scale(1.1); }

        /* Динамический остров (Smart Logic) */
        #island {
            position: absolute; top: calc(11px + var(--safe-top));
            left: 50%; transform: translateX(-50%);
            background: #000; z-index: 10000;
            width: 120px; height: 36px; border-radius: 20px;
            transition: all 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        #island.expanded { width: 350px; height: 180px; border-radius: 40px; }
        #island.notification { width: 350px; height: 75px; border-radius: 30px; }

        /* Сетка приложений */
        .home-screen {
            position: relative; z-index: 10;
            height: 100%; width: 100%;
            padding-top: calc(70px + var(--safe-top));
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .app-icon {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            width: 100%; cursor: pointer;
        }
        .icon-body {
            width: 72px; height: 72px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            background: white; transition: transform 0.2s;
        }
        .icon-body:active { transform: scale(0.85); }
        .icon-label { font-size: 12px; font-weight: 500; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }

        /* Система Окон */
        .app-window {
            position: absolute; inset: 0; z-index: 5000;
            background: #fff; border-radius: 44px;
            transform: translateY(105%);
            transition: transform 0.5s cubic-bezier(0.3, 1, 0.3, 1);
            overflow: hidden; color: black;
        }
        .app-window.active { transform: translateY(0); border-radius: 0; }
        
        /* Control Center */
        #control-center {
            position: absolute; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(45px);
            transform: translateY(-110%);
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            padding: calc(60px + var(--safe-top)) 25px;
        }
        #control-center.open { transform: translateY(0); }

        /* Полоска Home */
        #home-bar {
            position: absolute; bottom: 8px; left: 50%;
            transform: translateX(-50%);
            width: 135px; height: 5px;
            background: rgba(255,255,255,0.8);
            border-radius: 10px; z-index: 10001;
        }

        /* Виджеты */
        .widget-big {
            grid-column: span 2; grid-row: span 2;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border-radius: 28px; padding: 20px;
        }
    </style>
</head>
<body>

<div id="iphone-frame">
    <div id="wallpaper"></div>

    <div class="absolute top-0 w-full flex justify-between px-8 pt-4 z-[9999] font-bold text-sm" style="padding-top: calc(10px + var(--safe-top))">
        <div id="status-time">9:41</div>
        <div class="flex gap-2">
            <i data-lucide="signal" class="w-4"></i>
            <i data-lucide="wifi" class="w-4"></i>
            <i data-lucide="battery" class="w-4"></i>
        </div>
    </div>

    <div id="island" onclick="GOS.Island.toggle()">
        <div id="island-ui" class="opacity-0 transition-opacity w-full h-full p-4 flex items-center"></div>
    </div>

    <div id="control-center">
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white/10 p-4 rounded-3xl grid grid-cols-2 gap-4">
                <div class="cc-btn bg-blue-500 rounded-full w-12 h-12 flex items-center justify-center"><i data-lucide="wifi"></i></div>
                <div class="cc-btn bg-green-500 rounded-full w-12 h-12 flex items-center justify-center"><i data-lucide="signal"></i></div>
                <div class="cc-btn bg-blue-600 rounded-full w-12 h-12 flex items-center justify-center"><i data-lucide="bluetooth"></i></div>
                <div class="cc-btn bg-orange-500 rounded-full w-12 h-12 flex items-center justify-center"><i data-lucide="plane"></i></div>
            </div>
            <div class="bg-white/10 p-4 rounded-3xl flex flex-col justify-between">
                <div class="flex justify-between"><i data-lucide="moon"></i><i data-lucide="cast"></i></div>
                <p class="text-[10px] font-bold opacity-50 uppercase">Focus</p>
            </div>
            <div class="h-44 bg-white/10 rounded-3xl relative overflow-hidden">
                <div class="absolute bottom-0 w-full bg-white h-2/3"></div>
                <i data-lucide="sun" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-black/40"></i>
            </div>
            <div class="h-44 bg-white/10 rounded-3xl relative overflow-hidden">
                <div class="absolute bottom-0 w-full bg-white h-1/2"></div>
                <i data-lucide="volume-2" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-black/40"></i>
            </div>
        </div>
    </div>

    <div id="home-screen" class="home-screen overflow-y-auto">
        <div class="grid grid-cols-4 gap-y-8 px-5" id="app-grid">
            <div class="widget-big mb-4 flex flex-col justify-between">
                <div><p class="text-xs font-bold opacity-60 uppercase">Weather</p><h2 class="text-3xl font-light">24°</h2></div>
                <p class="text-xs">Mostly Clear</p>
            </div>
            </div>
    </div>

    <div id="app-layer"></div>
    <div id="home-bar" onclick="GOS.System.goHome()"></div>
</div>
<script>
const GOS = {
    apps: [
        { id: 'settings', name: 'Настройки', icon: 'settings', color: 'bg-gray-500', content: () => GOS.Views.Settings() },
        { id: 'kstore', name: 'K-Store', icon: 'shopping-bag', color: 'bg-blue-600', content: () => GOS.Views.Store() },
        { id: 'safari', name: 'Safari', icon: 'compass', color: 'bg-white text-blue-500', content: () => GOS.Views.Browser() },
        { id: 'photos', name: 'Фото', icon: 'image', color: 'bg-white text-pink-500', content: () => GOS.Views.Photos() },
        { id: 'files', name: 'Файлы', icon: 'folder', color: 'bg-white text-blue-600', content: () => `<div>Files</div>` }
    ],

    System: {
        activeApp: null,
        init() {
            this.renderApps();
            this.updateClock();
            setInterval(() => this.updateClock(), 1000);
            lucide.createIcons();
            
            // Детектор свайпа для CC
            let startY = 0;
            document.addEventListener('touchstart', e => startY = e.touches[0].clientY);
            document.addEventListener('touchend', e => {
                let endY = e.changedTouches[0].clientY;
                if(startY < 100 && endY > startY + 50) GOS.UI.toggleCC(true);
            });
        },

        renderApps() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML += GOS.apps.map(app => `
                <div class="app-icon" onclick="GOS.System.launch('${app.id}')">
                    <div class="icon-body ${app.color}"><i data-lucide="${app.icon}"></i></div>
                    <span class="icon-label">${app.name}</span>
                </div>
            `).join('');
        },

        launch(id) {
            const app = GOS.apps.find(a => a.id === id);
            const layer = document.getElementById('app-layer');
            let win = document.getElementById(`win-${id}`);
            
            if(!win) {
                win = document.createElement('div');
                win.id = `win-${id}`;
                win.className = 'app-window';
                win.innerHTML = app.content();
                layer.appendChild(win);
            }

            document.body.classList.add('blur-bg');
            setTimeout(() => {
                win.classList.add('active');
                lucide.createIcons();
            }, 10);
            this.activeApp = id;
        },

        goHome() {
            if(!this.activeApp) return;
            const win = document.getElementById(`win-${this.activeApp}`);
            win.classList.remove('active');
            document.body.classList.remove('blur-bg');
            document.getElementById('control-center').classList.remove('open');
            this.activeApp = null;
        },

        updateClock() {
            const now = new Date();
            document.getElementById('status-time').innerText = now.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
        }
    },

    UI: {
        toggleCC(show) {
            document.getElementById('control-center').classList.toggle('open', show);
        }
    },

    Island: {
        state: 'closed',
        toggle() {
            const isl = document.getElementById('island');
            const ui = document.getElementById('island-ui');
            if(this.state === 'closed') {
                isl.classList.add('expanded');
                ui.classList.replace('opacity-0', 'opacity-1');
                ui.innerHTML = `
                    <div class="flex-1 flex items-center gap-4">
                        <div class="w-16 h-16 bg-zinc-800 rounded-2xl flex items-center justify-center"><i data-lucide="music" class="text-pink-500"></i></div>
                        <div><p class="font-bold text-white">Apple Music</p><p class="text-xs text-gray-400">The Weeknd - Blinding Lights</p></div>
                    </div>
                `;
                this.state = 'open';
            } else {
                isl.classList.remove('expanded');
                ui.classList.replace('opacity-1', 'opacity-0');
                this.state = 'closed';
            }
            lucide.createIcons();
        }
    },

    Views: {
        Settings: () => `
            <div class="h-full bg-[#F2F2F7] p-6 pt-16 overflow-y-auto">
                <h1 class="text-3xl font-extrabold mb-6">Настройки</h1>
                <div class="bg-white rounded-2xl p-4 flex items-center gap-4 mb-8 shadow-sm">
                    <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-blue-700 rounded-full flex items-center justify-center text-white text-2xl font-bold">A</div>
                    <div><h2 class="font-bold">Apple ID</h2><p class="text-xs text-gray-400">iCloud, Media & Purchases</p></div>
                </div>
                <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                    <div class="p-4 border-b flex justify-between"><span>Авиарежим</span><i data-lucide="chevron-right" class="text-gray-300"></i></div>
                    <div class="p-4 border-b flex justify-between"><span>Wi-Fi</span><span class="text-gray-400 text-sm">Home_5G ></span></div>
                    <div class="p-4 border-b flex justify-between"><span>Bluetooth</span><span class="text-gray-400 text-sm">On ></span></div>
                    <div class="p-4 flex justify-between"><span>Уведомления</span><i data-lucide="chevron-right" class="text-gray-300"></i></div>
                </div>
                <div class="mt-8 bg-white rounded-2xl p-4 flex justify-between items-center text-red-500 font-medium">Выйти из G-ID</div>
            </div>`,
        Store: () => `
            <div class="h-full bg-white flex flex-col">
                <div class="pt-16 px-6 pb-4 flex justify-between items-end">
                    <h1 class="text-4xl font-extrabold">K-Store</h1>
                    <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">G</div>
                </div>
                <div class="flex-1 p-6 space-y-8 overflow-y-auto">
                    <div class="relative h-96 rounded-[40px] overflow-hidden shadow-2xl">
                        <img src="https://images.unsplash.com/photo-1616469829581-73993eb86b02?q=80&w=1000" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/80 p-8 flex flex-col justify-end">
                            <p class="text-blue-400 font-bold text-xs uppercase mb-2">Editor's Choice</p>
                            <h3 class="text-white text-3xl font-bold">Lumina Pro</h3>
                            <button class="mt-4 bg-white/20 backdrop-blur-md text-white px-6 py-2 rounded-full font-bold self-start">GET</button>
                        </div>
                    </div>
                </div>
            </div>`,
        Browser: () => `<div class="h-full pt-12"><iframe src="https://www.bing.com" class="w-full h-full border-none"></iframe></div>`,
        Photos: () => `
            <div class="h-full bg-white p-6 pt-16">
                <h1 class="text-3xl font-bold mb-6">Library</h1>
                <div class="grid grid-cols-3 gap-2">
                    <div class="aspect-square bg-gray-200 rounded-lg"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg"></div>
                </div>
            </div>`
    }
};

window.onload = () => GOS.System.init();
</script>
</body>
</html>
