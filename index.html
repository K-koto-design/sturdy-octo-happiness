<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Craft Mobile Enhanced</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; user-select: none; background-color: #87CEEB; transition: background-color 2s ease; }
        #menu { 
            position: absolute; width: 100%; height: 100%; 
            background: url('https://via.placeholder.com/1920x1080?text=Your+Game+Background') center/cover no-repeat; /* Замените на свое изображение */
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #menu-overlay { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1; }
        #menu-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; }
        .btn { 
            padding: 15px 40px; margin: 10px; 
            background: #55a02e; color: white; border: 4px solid #3d7321; 
            cursor: pointer; font-size: 20px; text-shadow: 2px 2px #000;
        }
        
        #game-ui { position: absolute; top: 10px; left: 10px; z-index: 10; display: none; color: white; }
        #inventory { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 5px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 5px; z-index: 10; }
        .slot { width: 50px; height: 50px; border: 2px solid #888; background: #333; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; position: relative; }
        .slot.active { border-color: #fff; background: #555; }
        .count { position: absolute; bottom: 2px; right: 2px; font-size: 10px; }

        #world { position: relative; width: 5000px; height: 100vh; transition: transform 0.1s; background-color: rgba(0,0,0,0); transition: background-color 2s ease; }
        .block { 
            position: absolute; width: 50px; height: 50px; 
            background-size: cover; image-rendering: pixelated;
        }
        
        /* Текстуры через CSS градиенты для легкости */
        .grass { background: #55a02e; border-top: 5px solid #7cfc00; }
        .dirt { background: #8B4513; }
        .stone { background: #808080; border: 2px solid #696969; }
        .wood { background: #A0522D; border: 2px solid #5D2906; }
        .leaf { background: #228B22; opacity: 0.9; }
        .iron { background: #808080; border: 4px dotted #ced4da; }
        .gold { background: #808080; border: 4px dotted #ffd700; }

        #controls { position: absolute; bottom: 30px; left: 30px; display: none; gap: 10px; z-index: 10; }
        .joy-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px; color: white; }

        #chat-input { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); width: 80%; max-width: 400px; padding: 10px; background: rgba(0,0,0,0.7); color: white; border: none; display: none; z-index: 100; }
        #chat-log { position: absolute; top: 10px; left: 10px; width: 300px; max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.5); color: white; padding: 10px; display: none; z-index: 99; font-size: 14px; }
        #chat-toggle { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); color: white; padding: 5px 10px; cursor: pointer; display: none; z-index: 10; }

        /* Погодные эффекты */
        .weather-effect {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 5;
        }
        .rain {
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII='); /* 1x1 прозрачный пиксель */
            background-repeat: repeat;
            animation: rainAnimation 0.5s linear infinite;
        }
        .snow {
            background-image: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAKklEQVR42u3PMQEAAAzDMAt+0+Y5KCAc3oQk/72jEAAAgABYdAAAYQABYdAAAWYhO9hXAAAAAElFTkSuQmCC'); /* маленькие белые круги */
            background-repeat: repeat;
            animation: snowAnimation 10s linear infinite;
            filter: blur(0.5px);
        }

        @keyframes rainAnimation {
            from { background-position: 0 0; }
            to { background-position: 100px 2000px; }
        }
        @keyframes snowAnimation {
            from { background-position: 0 0; }
            to { background-position: 500px 2000px; }
        }

    </style>
</head>
<body>

<div id="menu">
    <div id="menu-overlay"></div>
    <div id="menu-content">
        <h1 style="color: white; text-shadow: 3px 3px #000;">MINI CRAFT JS</h1>
        <div class="btn" onclick="startGame()">Начать игру</div>
        <div class="btn" onclick="showSettings()">Настройки</div>
    </div>
</div>

<div id="game-ui">
    <div style="background: rgba(0,0,0,0.5); padding: 5px; display: inline-block;">
        Инструмент: <span id="tool-name">Рука</span>
    </div>
</div>

<div id="inventory">
    <div class="slot active" onclick="selectSlot(0)" data-type="pickaxe">⛏️</div>
    <div class="slot" onclick="selectSlot(1)" data-type="shovel">▲</div>
    <div class="slot" onclick="selectSlot(2)" data-type="grass"><div class="count">0</div></div>
    <div class="slot" onclick="selectSlot(3)" data-type="stone"><div class="count">0</div></div>
    <div class="slot" onclick="selectSlot(4)" data-type="wood"><div class="count">0</div></div>
</div>

<div id="controls">
    <div class="joy-btn" ontouchstart="move(-1)" ontouchend="move(0)">←</div>
    <div class="joy-btn" ontouchstart="move(1)" ontouchend="move(0)">→</div>
</div>

<div id="chat-toggle" onclick="toggleChat()">💬</div>
<div id="chat-log"></div>
<input type="text" id="chat-input" placeholder="Нажмите Enter для чата...">

<div id="world"></div>
<div id="weather-effect" class="weather-effect"></div>


<script>
    const world = document.getElementById('world');
    const invSlots = document.querySelectorAll('.slot');
    const chatInput = document.getElementById('chat-input');
    const chatLog = document.getElementById('chat-log');
    const weatherEffect = document.getElementById('weather-effect');
    
    let inventory = { grass: 0, stone: 0, wood: 0, iron: 0 };
    let selectedType = 'pickaxe';
    let worldOffset = 0;
    let isDay = true;
    let weather = 'none'; // 'none', 'rain', 'snow'
    let dayNightCycleInterval;

    const blockWidth = 50;
    const blockHeight = 50;
    const worldWidth = 200; // Количество блоков по горизонтали

    // --- Меню и настройки ---
    function showSettings() {
        alert("Настройки пока не реализованы.");
    }

    function startGame() {
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game-ui').style.display = 'block';
        document.getElementById('controls').style.display = 'flex';
        document.getElementById('chat-toggle').style.display = 'block';
        generateWorld();
        startDayNightCycle();
    }

    // --- Генерация мира ---
    function generateWorld() {
        world.innerHTML = ''; // Очищаем мир перед генерацией
        for (let x = 0; x < worldWidth; x++) {
            // Базовая поверхность
            createBlock(x * blockWidth, window.innerHeight - blockHeight * 3, 'grass');
            createBlock(x * blockWidth, window.innerHeight - blockHeight * 2, 'dirt');
            createBlock(x * blockWidth, window.innerHeight - blockHeight * 1, 'dirt');

            // Камень и руда глубже
            if (x % 2 === 0) {
                const type = Math.random() > 0.1 ? 'stone' : (Math.random() > 0.5 ? 'iron' : 'gold');
                createBlock(x * blockWidth, window.innerHeight - blockHeight * 4, type);
            }

            // Деревья
            if (x % 8 === 0 && x > 5) {
                createBlock(x * blockWidth, window.innerHeight - blockHeight * 4, 'wood');
                createBlock(x * blockWidth, window.innerHeight - blockHeight * 5, 'wood');
                createBlock(x * blockWidth, window.innerHeight - blockHeight * 6, 'leaf');
                createBlock((x-1) * blockWidth, window.innerHeight - blockHeight * 6, 'leaf');
                createBlock((x+1) * blockWidth, window.innerHeight - blockHeight * 6, 'leaf');
            }
        }
    }

    function createBlock(x, y, type) {
        const block = document.createElement('div');
        block.className = `block ${type}`;
        block.style.left = x + 'px';
        block.style.top = y + 'px';
        block.dataset.type = type;
        
        block.onclick = (e) => handleBlockClick(e, block);
        world.appendChild(block);
        return block;
    }

    function handleBlockClick(e, block) {
        if (chatInput.style.display === 'block') return; // Не копать, если чат открыт

        const type = block.dataset.type;

        // Логика добычи
        if (selectedType === 'pickaxe' && (type === 'stone' || type === 'iron' || type === 'gold' || type === 'wood' || type === 'leaf')) {
            harvest(block);
        } else if (selectedType === 'shovel' && (type === 'grass' || type === 'dirt')) {
            harvest(block);
        } else if (!['pickaxe', 'shovel'].includes(selectedType)) {
            // Строительство (ставим блок рядом с кликнутым)
            if (inventory[selectedType] > 0) {
                const newY = parseInt(block.style.top) - blockHeight; // Ставим выше
                const existingBlock = document.elementFromPoint(e.clientX, e.clientY - blockHeight);
                if (existingBlock && existingBlock.classList.contains('block')) {
                    // Если место занято, пытаемся поставить правее
                    createBlock(parseInt(block.style.left) + blockWidth, parseInt(block.style.top), selectedType);
                } else {
                     createBlock(parseInt(block.style.left), newY, selectedType);
                }
               
                inventory[selectedType]--;
                updateInvDisplay();
            }
        }
    }

    function harvest(block) {
        const type = block.dataset.type;
        let resType = type;
        if (type === 'dirt' || type === 'grass') resType = 'grass';
        if (type === 'wood' || type === 'leaf') resType = 'wood';
        if (type === 'iron' || type === 'gold') resType = 'stone'; // Руда дает камень для простоты

        if (inventory[resType] !== undefined) {
             inventory[resType]++;
        } else {
            inventory[resType] = 1;
        }
       
        block.remove();
        updateInvDisplay();
    }

    // --- Инвентарь ---
    function selectSlot(index) {
        invSlots.forEach(s => s.classList.remove('active'));
        invSlots[index].classList.add('active');
        selectedType = invSlots[index].dataset.type;
        document.getElementById('tool-name').innerText = selectedType;
    }

    function updateInvDisplay() {
        invSlots.forEach(slot => {
            const type = slot.dataset.type;
            if (inventory[type] !== undefined) {
                const countElement = slot.querySelector('.count');
                if (countElement) {
                    countElement.innerText = inventory[type];
                }
            }
        });
    }

    // --- Управление персонажем ---
    let moveInterval;
    function move(dir) { // dir: -1 влево, 1 вправо, 0 стоп
        clearInterval(moveInterval);
        if (dir !== 0) {
            moveInterval = setInterval(() => {
                worldOffset -= dir * 10; // Скорость
                world.style.transform = `translateX(${worldOffset}px)`;
            }, 50);
        }
    }

    // --- День/Ночь ---
    function setDay() {
        isDay = true;
        document.body.style.backgroundColor = '#87CEEB'; // Голубое небо
        world.style.backgroundColor = 'rgba(0,0,0,0)'; // Мир без затемнения
        addChatMessage('Стало день.', 'system');
    }

    function setNight() {
        isDay = false;
        document.body.style.backgroundColor = '#2F4F4F'; // Темное небо
        world.style.backgroundColor = 'rgba(0,0,0,0.5)'; // Затемнение мира
        addChatMessage('Стало ночь.', 'system');
    }

    function startDayNightCycle() {
        clearInterval(dayNightCycleInterval); // Очистить предыдущий интервал, если есть
        dayNightCycleInterval = setInterval(() => {
            if (isDay) {
                setNight();
            } else {
                setDay();
            }
        }, 30000); // Смена дня/ночи каждые 30 секунд (для демонстрации)
    }

    // --- Погода ---
    function setWeather(newWeather) {
        weather = newWeather;
        weatherEffect.className = 'weather-effect'; // Сброс классов
        if (weather === 'rain') {
            weatherEffect.classList.add('rain');
            addChatMessage('Начался дождь.', 'system');
        } else if (weather === 'snow') {
            weatherEffect.classList.add('snow');
            addChatMessage('Начался снег.', 'system');
        } else {
            addChatMessage('Погода улучшилась.', 'system');
        }
    }

    // --- Чат ---
    function addChatMessage(message, type = 'user') {
        const msgDiv = document.createElement('div');
        msgDiv.innerText = message;
        msgDiv.style.color = type === 'system' ? 'lightblue' : 'white';
        chatLog.prepend(msgDiv); // Новые сообщения сверху
        if (chatLog.children.length > 10) { // Ограничить количество сообщений
            chatLog.removeChild(chatLog.lastChild);
        }
    }

    function toggleChat() {
        if (chatInput.style.display === 'block') {
            chatInput.style.display = 'none';
            chatLog.style.display = 'none';
            chatInput.value = '';
        } else {
            chatInput.style.display = 'block';
            chatLog.style.display = 'block';
            chatInput.focus();
        }
    }

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            const command = chatInput.value.trim().toLowerCase();
            addChatMessage(`> ${command}`, 'user');
            
            if (command === '/day') {
                setDay();
            } else if (command === '/night') {
                setNight();
            } else if (command === '/rain') {
                setWeather('rain');
            } else if (command === '/snow') {
                setWeather('snow');
            } else if (command === '/clear') {
                setWeather('none');
            } else {
                addChatMessage(`Неизвестная команда: ${command}`, 'system');
            }
            chatInput.value = '';
            chatInput.style.display = 'none'; // Скрыть чат после команды
            chatLog.style.display = 'none';
        }
    });

    // --- Инициализация ---
    selectSlot(0); // Выбираем кирку по умолчанию
    updateInvDisplay();

    // Поддержка клавиатуры для ПК
    window.addEventListener('keydown', (e) => {
        if (chatInput.style.display === 'block' && e.key !== 'Enter') return;

        if(e.key === 'a' || e.key === 'ArrowLeft') move(-1);
        if(e.key === 'd' || e.key === 'ArrowRight') move(1);
        if(e.key === 'Enter') toggleChat();

        // Переключение слотов инвентаря на ПК
        if (e.key >= '1' && e.key <= '5') {
            selectSlot(parseInt(e.key) - 1);
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'a' || e.key === 'ArrowLeft' || e.key === 'd' || e.key === 'ArrowRight') {
            move(0); // Остановить движение при отпускании кнопки
        }
    });

</script>

</body>
</html>
