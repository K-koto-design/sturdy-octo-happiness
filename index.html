<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS Pro 2026 | Ultimate Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/framer-motion/10.16.4/framer-motion.umd.min.js"></script>

    <style>
        :root {
            --ios-blue: #007AFF;
            --system-bg: #000000;
            --app-radius: 44px;
        }

        /* Базовые стили слоя */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
        }

        #phone-container {
            position: relative; width: 100%; height: 100dvh;
            max-width: 430px; margin: 0 auto;
            background: var(--system-bg);
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }

        /* Динамическая челка */
        #dynamic-island {
            position: absolute; top: 11px; left: 50%;
            transform: translateX(-50%);
            background: #000; color: white;
            width: 120px; height: 36px; border-radius: 20px;
            z-index: 10000; transition: all 0.6s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        #dynamic-island.expanded { width: 360px; height: 200px; border-radius: 45px; }
        #dynamic-island.pill { width: 200px; }

        /* Система окон приложений */
        .app-window {
            position: absolute; inset: 0; background: #fff;
            z-index: 500; border-radius: var(--app-radius);
            transform: translateY(110%) scale(0.9);
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1), border-radius 0.4s;
            overflow: hidden; display: none;
        }
        .app-window.active { display: block; transform: translateY(0) scale(1); border-radius: 0; }
        .app-window.minimized { 
            display: block; transform: translateY(15%) scale(0.8); 
            filter: brightness(0.5); border-radius: 44px; pointer-events: none;
        }

        /* Рабочий стол */
        .home-screen {
            position: absolute; inset: 0; z-index: 100;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') center/cover;
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.6s;
            padding-top: 60px;
        }
        .home-screen.blur { filter: blur(20px) brightness(0.7); transform: scale(1.1); }

        /* Сетка иконок */
        .icon-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: min-content; gap: 25px 16px; padding: 20px;
        }

        .ios-icon {
            display: flex; flex-direction: column; align-items: center; gap: 8px;
            cursor: pointer; transition: transform 0.2s;
        }
        .ios-icon:active { transform: scale(0.8); }
        .icon-shape {
            width: 72px; height: 72px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background-size: cover;
        }

        /* Центр управления */
        #control-center {
            position: absolute; inset: 0; z-index: 9000;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(50px);
            transform: translateY(-100%); transition: transform 0.5s cubic-bezier(0.3, 1, 0.3, 1);
            padding: 80px 30px;
        }
        #control-center.open { transform: translateY(0); }

        /* Многозадачность */
        #app-switcher {
            position: absolute; inset: 0; z-index: 8000;
            background: rgba(0,0,0,0.2); backdrop-filter: blur(20px);
            display: none; align-items: center; justify-content: center;
            overflow-x: auto; white-space: nowrap; padding: 0 50px;
        }

        /* FaceID Overlay */
        #faceid-overlay {
            position: absolute; inset: 0; z-index: 20000;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.8s;
        }

        .glass-card { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); border-radius: 24px; }
    </style>
</head>
<body>

<div id="phone-container">
    <div id="faceid-overlay">
        <div id="faceid-glyph" class="w-32 h-32 border-4 border-white/20 rounded-full flex items-center justify-center">
            <i data-lucide="scan-face" class="w-16 h-16 text-white animate-pulse"></i>
        </div>
        <h2 class="mt-8 text-xl font-medium">Face ID</h2>
    </div>

    <div id="dynamic-island" onclick="GOS.UI.Island.expand()">
        <div id="island-content" class="w-full h-full opacity-0 flex items-center justify-between px-6">
            </div>
    </div>

    <div id="control-center">
        <div class="grid grid-cols-2 gap-4">
            <div class="glass-card p-4 grid grid-cols-2 gap-4">
                <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center"><i data-lucide="wifi" class="w-6"></i></div>
                <div class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center"><i data-lucide="bluetooth" class="w-6"></i></div>
                <div class="w-12 h-12 rounded-full bg-green-500 flex items-center justify-center"><i data-lucide="signal" class="w-6"></i></div>
                <div class="w-12 h-12 rounded-full bg-orange-500 flex items-center justify-center"><i data-lucide="plane" class="w-6"></i></div>
            </div>
            <div class="glass-card p-4 flex items-center justify-around">
                <i data-lucide="moon" class="w-8 text-purple-400"></i>
                <i data-lucide="flashlight" class="w-8"></i>
            </div>
            <div class="glass-card h-40 flex items-end p-2">
                <div class="w-full bg-white/20 rounded-xl h-full relative overflow-hidden">
                    <div class="absolute bottom-0 w-full bg-white h-2/3"></div>
                    <i data-lucide="sun" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-black/50"></i>
                </div>
            </div>
            <div class="glass-card h-40 flex items-end p-2">
                <div class="w-full bg-white/20 rounded-xl h-full relative overflow-hidden">
                    <div class="absolute bottom-0 w-full bg-white h-1/2"></div>
                    <i data-lucide="volume-2" class="absolute bottom-4 left-1/2 -translate-x-1/2 text-black/50"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="home-screen" id="home-screen">
        <div class="px-8 mt-4 mb-8">
            <div class="glass-card p-4 flex items-center gap-4 border-none bg-white/20" onclick="GOS.UI.openSpotlight()">
                <i data-lucide="search" class="w-5 text-white/70"></i>
                <span class="text-white/70">Поиск в Google</span>
            </div>
        </div>
        
        <div id="main-grid" class="icon-grid">
            </div>

        <div class="absolute bottom-6 left-4 right-4 h-24 glass-card rounded-[35px] flex items-center justify-around px-4">
            <div class="ios-icon" onclick="GOS.Core.launchApp('phone')"><div class="icon-shape bg-green-500"><i data-lucide="phone" class="text-white w-9"></i></div></div>
            <div class="ios-icon" onclick="GOS.Core.launchApp('safari')"><div class="icon-shape bg-white"><img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg" class="w-12"></div></div>
            <div class="ios-icon" onclick="GOS.Core.launchApp('kstore')"><div class="icon-shape bg-blue-600"><i data-lucide="shopping-bag" class="text-white w-9"></i></div></div>
            <div class="ios-icon" onclick="GOS.Core.launchApp('music')"><div class="icon-shape bg-gradient-to-br from-pink-500 to-red-500"><i data-lucide="music" class="text-white w-9"></i></div></div>
        </div>
    </div>

    <div id="apps-container"></div>

    <div id="home-bar" class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-white/50 rounded-full z-[10000] cursor-pointer" 
         onmousedown="GOS.Core.startHomeGesture(event)"></div>
</div>

<script>
/**
 * GOS 2026 KERNEL - ОБЪЕКТНО-ОРИЕНТИРОВАННОЕ ЯДРО
 */
const GOS = {
    state: {
        isLocked: true,
        activeApp: null,
        runningApps: [],
        battery: 88,
        version: "26.1.0",
        installedApps: [
            { id: 'settings', name: 'Настройки', icon: 'settings', color: 'bg-gray-500' },
            { id: 'weather', name: 'Погода', icon: 'cloud-sun', color: 'bg-sky-400' },
            { id: 'photos', name: 'Фото', icon: 'image', color: 'bg-white text-blue-500' },
            { id: 'notes', name: 'Заметки', icon: 'edit-3', color: 'bg-orange-400' },
            { id: 'files', name: 'Файлы', icon: 'folder', color: 'bg-white text-blue-600' },
            { id: 'maps', name: 'Карты', icon: 'map', color: 'bg-green-500' },
            { id: 'camera', name: 'Камера', icon: 'camera', color: 'bg-zinc-800' }
        ]
    },

    Core: {
        boot() {
            lucide.createIcons();
            setTimeout(() => this.runFaceID(), 1000);
            this.renderHomeGrid();
            this.initSystemTime();
        },

        runFaceID() {
            const overlay = document.getElementById('faceid-overlay');
            const glyph = document.getElementById('faceid-glyph');
            
            // Имитация сканирования
            setTimeout(() => {
                glyph.style.borderColor = "#4ade80";
                glyph.innerHTML = '<i data-lucide="check" class="w-16 h-16 text-green-400"></i>';
                lucide.createIcons();
                
                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => overlay.remove(), 800);
                    GOS.state.isLocked = false;
                    GOS.UI.Island.notify("GOS Pro", "FaceID подтвержден", "lock-open");
                }, 500);
            }, 1500);
        },

        launchApp(id) {
            const container = document.getElementById('apps-container');
            let appEl = document.getElementById(`app-${id}`);

            if (!appEl) {
                appEl = document.createElement('div');
                appEl.id = `app-${id}`;
                appEl.className = 'app-window';
                appEl.innerHTML = GOS.AppFactory.create(id);
                container.appendChild(appEl);
                if (!GOS.state.runningApps.includes(id)) GOS.state.runningApps.push(id);
            }

            document.getElementById('home-screen').classList.add('blur');
            appEl.style.display = 'block';
            setTimeout(() => {
                appEl.classList.add('active');
                GOS.state.activeApp = id;
                lucide.createIcons();
            }, 50);
        },

        closeActiveApp() {
            if (!GOS.state.activeApp) return;
            const appEl = document.getElementById(`app-${GOS.state.activeApp}`);
            appEl.classList.remove('active');
            document.getElementById('home-screen').classList.remove('blur');
            setTimeout(() => {
                appEl.style.display = 'none';
                GOS.state.activeApp = null;
            }, 600);
        },

        renderHomeGrid() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = GOS.state.installedApps.map(app => `
                <div class="ios-icon" onclick="GOS.Core.launchApp('${app.id}')">
                    <div class="icon-shape ${app.color} shadow-lg">
                        <i data-lucide="${app.icon}" class="${app.color.includes('white') ? '' : 'text-white'} w-9"></i>
                    </div>
                    <span class="text-white text-[12px] font-medium tracking-wide">${app.name}</span>
                </div>
            `).join('');
        },

        initSystemTime() {
            // Реализация обновления времени во всех виджетах
        }
    },

    UI: {
        Island: {
            state: 'idle',
            notify(title, msg, icon) {
                const island = document.getElementById('dynamic-island');
                const content = document.getElementById('island-content');
                
                island.classList.add('pill');
                content.classList.remove('opacity-0');
                content.innerHTML = `
                    <div class="flex items-center gap-3 w-full">
                        <i data-lucide="${icon}" class="w-4 h-4 text-ios-blue"></i>
                        <span class="text-xs font-bold truncate">${title}: ${msg}</span>
                    </div>
                `;
                lucide.createIcons();
                
                setTimeout(() => {
                    island.classList.remove('pill');
                    content.classList.add('opacity-0');
                }, 3000);
            },
            expand() {
                const island = document.getElementById('dynamic-island');
                const content = document.getElementById('island-content');
                
                if(this.state === 'idle') {
                    island.classList.add('expanded');
                    content.classList.remove('opacity-0');
                    content.innerHTML = `
                        <div class="flex flex-col w-full p-4 h-full">
                            <div class="flex justify-between items-center mb-6">
                                <div class="flex items-center gap-4">
                                    <div class="w-14 h-14 bg-zinc-800 rounded-2xl flex items-center justify-center">
                                        <i data-lucide="music" class="text-pink-500 w-8"></i>
                                    </div>
                                    <div>
                                        <p class="font-bold">Blinding Lights</p>
                                        <p class="text-sm opacity-50">The Weeknd</p>
                                    </div>
                                </div>
                                <div class="flex gap-1 items-end h-8">
                                    <div class="w-1.5 bg-green-400 animate-bounce h-4"></div>
                                    <div class="w-1.5 bg-green-400 animate-bounce h-7" style="animation-delay: 0.1s"></div>
                                    <div class="w-1.5 bg-green-400 animate-bounce h-5" style="animation-delay: 0.2s"></div>
                                </div>
                            </div>
                            <div class="flex justify-around items-center">
                                <i data-lucide="skip-back" class="w-8"></i>
                                <i data-lucide="pause" class="w-10 fill-white"></i>
                                <i data-lucide="skip-forward" class="w-8"></i>
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                    this.state = 'expanded';
                } else {
                    island.classList.remove('expanded');
                    content.classList.add('opacity-0');
                    this.state = 'idle';
                }
            }
        },
        toggleCC() {
            document.getElementById('control-center').classList.toggle('open');
        }
    },

    AppFactory: {
        create(id) {
            // Масштабируемый генератор контента приложений
            const templates = {
                settings: `
                    <div class="h-full bg-[#F2F2F7] overflow-y-auto pb-20">
                        <div class="pt-16 px-6 mb-6 flex justify-between items-end">
                            <h1 class="text-4xl font-bold text-black">Настройки</h1>
                        </div>
                        <div class="px-4 space-y-6 text-black">
                            <div class="bg-white rounded-2xl p-4 flex items-center gap-4 shadow-sm">
                                <div class="w-14 h-14 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-2xl">A</div>
                                <div class="flex-1">
                                    <h3 class="font-bold">Александр GOS</h3>
                                    <p class="text-xs text-gray-400">G-ID, Облако, Контент и Покупки</p>
                                </div>
                                <i data-lucide="chevron-right" class="text-gray-300"></i>
                            </div>
                            <div class="bg-white rounded-2xl overflow-hidden shadow-sm">
                                <div class="p-4 border-b flex justify-between items-center active:bg-gray-100" onclick="GOS.UI.Island.notify('System', 'Обновление ПО не требуется', 'refresh-cw')">
                                    <div class="flex items-center gap-3"><div class="w-7 h-7 bg-orange-500 rounded flex items-center justify-center text-white"><i data-lucide="refresh-cw" class="w-4"></i></div><span>Обновление ПО</span></div>
                                    <i data-lucide="chevron-right" class="text-gray-300 w-4"></i>
                                </div>
                                <div class="p-4 flex justify-between items-center active:bg-gray-100">
                                    <div class="flex items-center gap-3"><div class="w-7 h-7 bg-blue-500 rounded flex items-center justify-center text-white"><i data-lucide="info" class="w-4"></i></div><span>Об устройстве</span></div>
                                    <span class="text-gray-400 text-sm">GOS 26.1 ></span>
                                </div>
                            </div>
                        </div>
                    </div>`,
                kstore: `
                    <div class="h-full bg-white overflow-y-auto">
                        <div class="pt-16 px-6 flex justify-between items-end mb-6">
                            <h1 class="text-4xl font-extrabold text-black">K-Store</h1>
                            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">A</div>
                        </div>
                        <div class="px-6 space-y-8 pb-24">
                            <div class="relative w-full h-96 rounded-[40px] overflow-hidden shadow-2xl">
                                <img src="https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000" class="w-full h-full object-cover">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 p-8 flex flex-col justify-end">
                                    <p class="text-blue-400 font-bold text-xs mb-2">ПРИЛОЖЕНИЕ ДНЯ</p>
                                    <h2 class="text-3xl text-white font-bold">Neural Canvas AI</h2>
                                    <p class="text-white/60 text-sm mt-2">Рисуйте нейросетями в 8K</p>
                                    <button class="mt-4 bg-white text-black py-2 px-6 rounded-full font-bold w-max" onclick="GOS.UI.Island.notify('K-Store', 'Загрузка началась...', 'download-cloud')">ЗАГРУЗИТЬ</button>
                                </div>
                            </div>
                        </div>
                    </div>`,
                placeholder: (id) => `<div class="h-full flex flex-col items-center justify-center bg-gray-50 text-black">
                    <i data-lucide="layers" class="w-20 h-20 text-blue-500 opacity-20 mb-4"></i>
                    <h2 class="text-2xl font-bold uppercase">${id}</h2>
                    <p class="text-gray-400 mt-2">Модуль в разработке</p>
                </div>`
            };
            return templates[id] || templates.placeholder(id);
        }
    }
};

// Запуск системы
window.onload = () => GOS.Core.boot();

// Глобальные жесты
document.addEventListener('keydown', e => {
    if(e.key === 'h') GOS.Core.closeActiveApp(); // Хоткей для Home
});
</script>
</body>
</html>
