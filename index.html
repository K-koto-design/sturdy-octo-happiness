<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GOS 26 Ultimate</title>
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --ios-card: #ffffff;
            --ios-text: #000000;
            --ios-gray: #8e8e93;
            --system-blur: blur(20px) saturate(180%);
            --anim-bezier: cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-text: #ffffff;
            --ios-gray: #aeaeb2;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #device {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 932px;
            background: #000;
            overflow: hidden;
            color: var(--ios-text);
        }

        /* Status Bar */
        #status-bar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            z-index: 10000;
            font-size: 14px;
            font-weight: 600;
            pointer-events: none;
        }

        #status-bar .right {
            display: flex;
            gap: 6px;
        }

        /* Lock Screen */
        #lock-screen {
            position: absolute;
            inset: 0;
            z-index: 9000;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564') center/cover;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 100px;
            transition: transform 0.6s var(--anim-bezier);
        }

        #lock-screen.unlocked {
            transform: translateY(-100%);
        }

        #lock-time {
            font-size: 80px;
            font-weight: 700;
            letter-spacing: -2px;
            color: #fff;
        }

        #lock-date {
            font-size: 20px;
            font-weight: 500;
            color: #fff;
        }

        .swipe-hint {
            position: absolute;
            bottom: 60px;
            color: #fff;
            font-size: 13px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Home Screen */
        #home-screen {
            position: absolute;
            inset: 0;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564') center/cover;
            padding-top: 60px;
            z-index: 100;
            transition: transform 0.5s var(--anim-bezier);
        }

        #home-screen.blur {
            filter: blur(10px);
            transform: scale(0.95);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 30px;
            overflow: hidden;
        }

        .app-name {
            color: #fff;
            font-size: 11px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Dock */
        #dock {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 90px;
            background: rgba(255,255,255,0.25);
            backdrop-filter: var(--system-blur);
            border-radius: 35px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 0 10px;
        }

        /* App Windows */
        .window {
            position: absolute;
            inset: 0;
            background: var(--ios-bg);
            z-index: 2000;
            transform: translateY(100%);
            transition: transform 0.5s var(--anim-bezier), border-radius 0.3s;
            display: flex;
            flex-direction: column;
            border-radius: 40px;
        }

        .window.active {
            transform: translateY(0);
            border-radius: 0;
        }

        .app-header {
            padding: 60px 20px 20px;
            font-size: 34px;
            font-weight: 700;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 100px;
        }

        /* Settings UI */
        .settings-group {
            background: var(--ios-card);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .settings-item {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .settings-item:last-child { border: none; }
        .settings-item:active { background: rgba(0,0,0,0.05); }

        .settings-label { font-size: 17px; }
        .settings-value { color: var(--ios-gray); font-size: 17px; }

        /* Control Center */
        #control-center {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(40px);
            z-index: 11000;
            transform: translateY(-100%);
            transition: transform 0.4s var(--anim-bezier);
            padding: 80px 30px;
        }

        #control-center.active { transform: translateY(0); }

        .cc-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .cc-tile {
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .cc-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Boot Screen */
        #boot-screen {
            position: absolute;
            inset: 0;
            background: #000;
            z-index: 20000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .boot-logo { width: 80px; filter: invert(1); margin-bottom: 40px; }
        .progress-container { width: 200px; height: 3px; background: #333; border-radius: 2px; }
        .progress-bar { width: 0%; height: 100%; background: #fff; transition: width 0.1s; }

        /* Home Indicator */
        #home-indicator {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 134px;
            height: 5px;
            background: rgba(255,255,255,0.8);
            border-radius: 10px;
            z-index: 10001;
            cursor: pointer;
        }
        
        .dark-indicator { background: rgba(0,0,0,0.8) !important; }

        /* Admin Panel Overlay */
        #admin-panel {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 15000;
            display: none;
            padding: 50px 20px;
            color: #fff;
        }

        .input-box {
            width: 100%;
            background: #222;
            border: none;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }

        .btn-update {
            background: var(--ios-blue);
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 20px;
        }

        /* Dynamic Island */
        #dynamic-island {
            position: absolute;
            top: 11px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 12000;
            transition: all 0.4s var(--anim-bezier);
            display: flex;
            align-items: center;
            padding: 0 15px;
            color: white;
            font-size: 12px;
            cursor: pointer;
        }

        #dynamic-island.expanded {
            width: 350px;
            height: 80px;
            border-radius: 35px;
        }
    </style>
</head>
<body data-theme="light">

        <div id="boot-screen">
            <svg class="boot-logo" viewBox="0 0 170 170"><path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69.03-8.14-1.05-13.36-3.23-5.22-2.18-9.84-3.27-13.84-3.27-4 0-8.67 1.11-14.01 3.33-5.34 2.22-9.59 3.37-12.76 3.45-5.22.11-10.05-2-14.5-6.35-2.9-2.51-6.66-7.03-11.26-13.56-3.35-4.79-6.24-10-8.68-15.66-2.44-5.65-4.21-12.2-5.31-19.66-1.11-7.44-1.66-14.66-1.66-21.66 0-10.99 2.1-20.21 6.3-27.64 4.19-7.44 9.87-13.23 17.03-17.38 7.16-4.14 15.14-6.21 23.94-6.21 4.54 0 9.77 1.05 15.69 3.16 5.92 2.1 10.21 3.16 12.87 3.16 2.01 0 6.54-1.25 13.59-3.75 7.05-2.51 12.83-3.64 17.35-3.41 12.1.61 21.57 5.09 28.39 13.43-10.45 6.33-15.61 15.02-15.49 26.07.12 8.74 3.19 16 9.21 21.78 6.03 5.79 12.98 9.07 20.84 9.84-.57 4.11-1.39 8.24-2.44 12.38zM114.04 18.17c0 7.93-3.04 15.33-9.11 22.18-7.14 8.08-15.86 12.63-24.81 12.15-.19-7.79 2.88-15.34 9.17-22.31 3.17-3.52 7.07-6.49 11.69-8.92 4.61-2.43 9.12-3.76 13.52-4.01.2 7.82-2.3 14.88-9.46 20.91z"/></svg>

        <div id="status-bar">

        <div id="dynamic-island">
            <span id="island-text">GOS 26</span>
        </div>

        <div id="cc-trigger" style="position:absolute;top:0;right:0;width:100px;height:40px;z-index:10005;" onmousedown="openCC()"></div>

        <div id="control-center">
            <div class="cc-grid">
                <div class="cc-tile">
                    <div class="cc-btn" style="background:#007aff">✈️</div>
                    <div class="cc-btn" style="background:#34c759">📶</div>
                    <div class="cc-btn" style="background:#007aff">🛜</div>

                </div>
                <div class="cc-tile">
                    <div class="cc-btn" style="background:#5856d6">🌙</div>
                    <div style="font-size:12px; width:100%; text-align:center">Focus</div>
                </div>
                <div class="cc-tile" style="height:150px; background:rgba(255,255,255,0.3)">

        <div id="lock-screen">

        </div>

        <div id="home-screen">
            <div class="app-grid" id="main-grid">

            <div id="dock">
                </div>

        <div id="app-layer"></div>

        <div id="admin-panel">
            <h2>Admin OS Control</h2>
            <p>Push global update to all simulators.</p>
            <input type="text" id="admin-version" class="input-box" placeholder="Version (e.g. 26.1.4)">
            <textarea id="admin-notes" class="input-box" placeholder="Release Notes" style="height:100px"></textarea>
            <button class="btn-update" onclick="pushUpdate()">Publish OTA Update</button>
            <button class="btn-update" style="background:#444" onclick="closeAdmin()">Cancel</button>
        </div>

        <div id="home-indicator" onclick="handleHome()"></div>
    </div>

    <script>
        // System State
        const SYSTEM = {
            version: localStorage.getItem('gos_version') || '26.0.0',
            build: '26A5285h',
            storage: '256 GB',
            memory: '8 GB',
            name: 'iPhone 15 Pro',
            uptime: '0h 0m',
            isDark: localStorage.getItem('gos_theme') === 'dark',
            installedApps: JSON.parse(localStorage.getItem('gos_apps')) || [
                {id: 'settings', name: 'Settings', icon: '⚙️', type: 'system'},
                {id: 'kstore', name: 'K-Store', icon: '🏪', type: 'system'},
                {id: 'phone', name: 'Phone', icon: '📞', type: 'system'},
                {id: 'safari', name: 'Safari', icon: '🧭', type: 'system'},
                {id: 'messages', name: 'Messages', icon: '💬', type: 'system'},
                {id: 'photos', name: 'Photos', icon: '🖼️', type: 'system'},
                {id: 'music', name: 'Music', icon: '🎵', type: 'system'},
                {id: 'notes', name: 'Notes', icon: '📝', type: 'system'}
            ],
            updatePending: JSON.parse(localStorage.getItem('gos_update')) || null,
            isUpdating: false
        };

        // Initialize UI
        function init() {
            renderHome();
            updateClock();
            setInterval(updateClock, 1000);
            applyTheme();
            
            // Handle gestures
            let startY = 0;
            document.addEventListener('touchstart', e => startY = e.touches[0].clientY);
            document.addEventListener('touchend', e => {
                let endY = e.changedTouches[0].clientY;
                if(startY - endY > 100 && document.getElementById('lock-screen').style.transform !== 'translateY(-100%)') {
                    unlock();
                }
            });
        }

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
            const date = now.toLocaleDateString([], {weekday: 'long', month: 'long', day: 'numeric'});
            document.getElementById('status-time').innerText = time;
            document.getElementById('lock-time').innerText = time;
            document.getElementById('lock-date').innerText = date;
        }

        function unlock() {
            document.getElementById('lock-screen').classList.add('unlocked');
        }

        function handleHome() {
            const layer = document.getElementById('app-layer');
            if(layer.innerHTML !== "") {
                const activeWin = layer.querySelector('.window');
                activeWin.classList.remove('active');
                setTimeout(() => {
                    layer.innerHTML = "";
                    document.getElementById('home-screen').classList.remove('blur');
                    document.getElementById('home-indicator').classList.remove('dark-indicator');
                }, 500);
            }
        }

        function openCC() {
            document.getElementById('control-center').classList.add('active');
        }

        function closeCC() {
            document.getElementById('control-center').classList.remove('active');
        }

        function applyTheme() {
            document.body.setAttribute('data-theme', SYSTEM.isDark ? 'dark' : 'light');
        }

        function renderHome() {
            const grid = document.getElementById('main-grid');
            const dock = document.getElementById('dock');
            grid.innerHTML = "";
            dock.innerHTML = "";

            SYSTEM.installedApps.forEach((app, index) => {
                const html = `
                    <div class="app-icon" onclick="openApp('${app.id}')">
                        <div class="icon-box">${app.icon}</div>
                        <div class="app-name">${app.name}</div>
                    </div>
                `;
                if(index < 4) dock.innerHTML += html;
                else grid.innerHTML += html;
            });
        }

        function openApp(id) {
            const layer = document.getElementById('app-layer');
            document.getElementById('home-screen').classList.add('blur');
            document.getElementById('home-indicator').classList.add('dark-indicator');
            
            const win = document.createElement('div');
            win.className = 'window';
            win.innerHTML = getAppContent(id);
            layer.appendChild(win);
            
            setTimeout(() => win.classList.add('active'), 10);
        }

        function getAppContent(id) {
            let content = "";
            switch(id) {
                case 'settings':
                    content = `
                        <div class="app-header">Settings</div>
                        <div class="app-content">
                            <div class="settings-group">
                                <div class="settings-item" onclick="openAdminCheck()">
                                    <div class="settings-label">User Profile</div>
                                    <div class="settings-value">G-Developer</div>
                                </div>
                            </div>
                            <div class="settings-group">
                                <div class="settings-item" onclick="openSubPage('General')">
                                    <div class="settings-label">General</div>
                                    <div class="settings-value">></div>
                                </div>
                                <div class="settings-item" onclick="toggleTheme()">
                                    <div class="settings-label">Appearance</div>
                                    <div class="settings-value">${SYSTEM.isDark ? 'Dark' : 'Light'}</div>
                                </div>
                            </div>
                            <div class="settings-group">
                                <div class="settings-item">
                                    <div class="settings-label">Wi-Fi</div>
                                    <div class="settings-value">Connected</div>
                                </div>
                                <div class="settings-item">
                                    <div class="settings-label">Battery</div>
                                    <div class="settings-value">85%</div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'kstore':
                    content = `
                        <div class="app-header">K-Store</div>
                        <div class="app-content">
                            <p style="margin-bottom:20px; color:var(--ios-gray)">Explore apps for GOS 26.</p>
                            <div class="settings-group">
                                <div class="settings-item">
                                    <div class="settings-label">Instagram</div>
                                    <button class="btn-update" style="width:auto; padding:5px 15px; margin:0" onclick="installApp('Instagram', '📸')">GET</button>
                                </div>
                                <div class="settings-item">
                                    <div class="settings-label">Weather</div>
                                    <button class="btn-update" style="width:auto; padding:5px 15px; margin:0" onclick="installApp('Weather', '☀️')">GET</button>
                                </div>
                                <div class="settings-item">
                                    <div class="settings-label">YouTube</div>
                                    <button class="btn-update" style="width:auto; padding:5px 15px; margin:0" onclick="installApp('YouTube', '📺')">GET</button>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                case 'safari':
                    content = `
                        <div class="app-header" style="padding-top:50px; font-size:20px">Safari</div>
                        <iframe src="https://www.bing.com" style="width:100%; flex:1; border:none; background:#fff"></iframe>
                    `;
                    break;
                case 'messages':
                    content = `
                        <div class="app-header">Messages</div>
                        <div class="app-content">
                            <div class="settings-group">
                                <div class="settings-item">
                                    <div>
                                        <div style="font-weight:600">Apple System</div>
                                        <div style="font-size:14px; color:var(--ios-gray)">Welcome to GOS 26.</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    break;
                default:
                    content = `<div class="app-header">${id}</div><div class="app-content">Coming soon in GOS 26.1</div>`;
            }
            return content;
        }

        // Settings Pages
        function openSubPage(page) {
            const content = document.querySelector('.app-content');
            if(page === 'General') {
                content.innerHTML = `
                    <div class="settings-group">
                        <div class="settings-item" onclick="openSubPage('About')">
                            <div class="settings-label">About</div>
                            <div class="settings-value">></div>
                        </div>
                        <div class="settings-item" onclick="openSubPage('SoftwareUpdate')">
                            <div class="settings-label">Software Update</div>
                            <div class="settings-value">${SYSTEM.updatePending ? '1' : ''} ></div>
                        </div>
                    </div>
                `;
            } else if (page === 'About') {
                content.innerHTML = `
                    <div class="settings-group">
                        <div class="settings-item">
                            <div class="settings-label">Name</div>
                            <div class="settings-value">${SYSTEM.name}</div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">OS Version</div>
                            <div class="settings-value">${SYSTEM.version}</div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">Build Number</div>
                            <div class="settings-value">${SYSTEM.build}</div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">Storage</div>
                            <div class="settings-value">${SYSTEM.storage}</div>
                        </div>
                        <div class="settings-item">
                            <div class="settings-label">Memory</div>
                            <div class="settings-value">${SYSTEM.memory}</div>
                        </div>
                    </div>
                `;
            } else if (page === 'SoftwareUpdate') {
                if(SYSTEM.updatePending) {
                    content.innerHTML = `
                        <div style="text-align:center; padding:20px">
                            <h2 style="font-size:40px">GOS ${SYSTEM.updatePending.version}</h2>
                            <p style="color:var(--ios-gray)">GOS Next Update Available</p>
                        </div>
                        <div class="settings-group">
                            <div class="settings-item" style="flex-direction:column; align-items:flex-start">
                                <div style="font-weight:bold; margin-bottom:10px">What's New</div>
                                <div style="font-size:14px">${SYSTEM.updatePending.notes}</div>
                            </div>
                        </div>
                        <button class="btn-update" onclick="runUpdate()">Install Now</button>
                    `;
                } else {
                    content.innerHTML = `<p style="text-align:center; margin-top:50px; color:var(--ios-gray)">GOS ${SYSTEM.version} is up to date.</p>`;
                }
            }
        }

        // Update Mechanism
        function runUpdate() {
            document.getElementById('boot-screen').style.display = 'flex';
            let progress = 0;
            const bar = document.getElementById('boot-p');
            const interval = setInterval(() => {
                progress += Math.random() * 5;
                if(progress > 100) progress = 100;
                bar.style.width = progress + '%';
                
                if(progress === 100) {
                    clearInterval(interval);
                    SYSTEM.version = SYSTEM.updatePending.version;
                    localStorage.setItem('gos_version', SYSTEM.version);
                    SYSTEM.updatePending = null;
                    localStorage.removeItem('gos_update');
                    setTimeout(() => location.reload(), 1000);
                }
            }, 150);
        }

        // Admin Panel Logic
        let tapCount = 0;
        function openAdminCheck() {
            tapCount++;
            if(tapCount === 5) {
                document.getElementById('admin-panel').style.display = 'block';
                tapCount = 0;
            }
        }

        function closeAdmin() {
            document.getElementById('admin-panel').style.display = 'none';
        }

        function pushUpdate() {
            const v = document.getElementById('admin-version').value;
            const n = document.getElementById('admin-notes').value;
            if(!v) return alert("Version required");
            
            const updateObj = {version: v, notes: n};
            SYSTEM.updatePending = updateObj;
            localStorage.setItem('gos_update', JSON.stringify(updateObj));
            
            document.getElementById('dynamic-island').classList.add('expanded');
            document.getElementById('island-text').innerText = "OTA Update Published: " + v;
            
            setTimeout(() => {
                document.getElementById('dynamic-island').classList.remove('expanded');
                document.getElementById('island-text').innerText = "GOS 26";
                closeAdmin();
            }, 3000);
        }

        // Theme
        function toggleTheme() {
            SYSTEM.isDark = !SYSTEM.isDark;
            localStorage.setItem('gos_theme', SYSTEM.isDark ? 'dark' : 'light');
            applyTheme();
            handleHome();
        }

        // App Store Logic
        function installApp(name, icon) {
            if(SYSTEM.installedApps.find(a => a.name === name)) return alert("App already installed");
            SYSTEM.installedApps.push({id: name.toLowerCase(), name, icon, type: 'user'});
            localStorage.setItem('gos_apps', JSON.stringify(SYSTEM.installedApps));
            renderHome();
            document.getElementById('dynamic-island').classList.add('expanded');
            document.getElementById('island-text').innerText = "Installing " + name + "...";
            setTimeout(() => {
                document.getElementById('dynamic-island').classList.remove('expanded');
                document.getElementById('island-text').innerText = "GOS 26";
            }, 2000);
        }

        init();
    </script>
</body>
</html>
